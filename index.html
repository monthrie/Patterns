<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// ========== SHAPE PRESETS ==========
function makePreset(name, curW, curH) {
  if (name === 'staircase-boot') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 4 ? 8 + y * 2 : gw;
      for (let x = 0; x < Math.min(w, gw); x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'L-shape') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 2 ? 8 : gw;
      for (let x = 0; x < w; x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'cross') {
    const gw = 15, gh = 15;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++)
      for (let x = 0; x < gw; x++)
        if ((x >= 5 && x < 10) || (y >= 5 && y < 10)) cells[y][x] = true;
    return { cells, gw, gh };
  }
  const gw = curW || 18, gh = curH || 10;
  return { cells: Array.from({length: gh}, () => Array(gw).fill(true)), gw, gh };
}

// ========== CELL-GRID SHAPE FUNCTIONS ==========
function buildEdges(cells, gw, gh) {
  const hUnits = [];
  const vUnits = [];
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below) hUnits.push({y, x});
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right) vUnits.push({x, y});
    }
  const edges = [];
  const hByY = {};
  for (const e of hUnits) { if (!hByY[e.y]) hByY[e.y] = []; hByY[e.y].push(e.x); }
  for (const y in hByY) {
    const xs = hByY[y].sort((a,b) => a-b);
    let start = xs[0];
    for (let i = 1; i <= xs.length; i++) {
      if (i < xs.length && xs[i] === xs[i-1] + 1) continue;
      edges.push({ y: +y, x0: start, x1: xs[i-1] + 1, type: 'h' });
      if (i < xs.length) start = xs[i];
    }
  }
  const vByX = {};
  for (const e of vUnits) { if (!vByX[e.x]) vByX[e.x] = []; vByX[e.x].push(e.y); }
  for (const x in vByX) {
    const ys = vByX[x].sort((a,b) => a-b);
    let start = ys[0];
    for (let i = 1; i <= ys.length; i++) {
      if (i < ys.length && ys[i] === ys[i-1] + 1) continue;
      edges.push({ x: +x, y0: start, y1: ys[i-1] + 1, type: 'v' });
      if (i < ys.length) start = ys[i];
    }
  }
  return edges;
}

function buildGaps(cells, gw, gh) {
  const gaps = [];
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below)
        gaps.push({ x: x + 0.5, y, isH: true, interiorBelow: !!below });
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right)
        gaps.push({ x, y: y + 0.5, isH: false, interiorRight: !!right });
    }
  return gaps;
}

function getInitialDir(gap) {
  if (gap.isH) {
    return gap.interiorBelow ? { dx: 1, dy: 1 } : { dx: -1, dy: -1 };
  }
  return gap.interiorRight ? { dx: 1, dy: -1 } : { dx: -1, dy: 1 };
}

function pointToGapIdx(px, py, gaps) {
  for (let i = 0; i < gaps.length; i++)
    if (Math.abs(px - gaps[i].x) < 0.1 && Math.abs(py - gaps[i].y) < 0.1) return i;
  return -1;
}

function isOnBoundary(px, py, cells, gw, gh) {
  const E = 0.01;
  const iy = Math.round(py), ix = Math.round(px);
  if (Math.abs(py - iy) < E) {
    const cx = Math.floor(px);
    if (cx >= 0 && cx < gw) {
      const above = iy > 0 ? !!cells[iy-1]?.[cx] : false;
      const below = iy < gh ? !!cells[iy]?.[cx] : false;
      if (above !== below) return true;
    }
  }
  if (Math.abs(px - ix) < E) {
    const cy = Math.floor(py);
    if (cy >= 0 && cy < gh) {
      const left = ix > 0 ? !!cells[cy]?.[ix-1] : false;
      const right = ix < gw ? !!cells[cy]?.[ix] : false;
      if (left !== right) return true;
    }
  }
  return false;
}

// ========== BILLIARD TRACING ==========
function tracePath(startIdx, gaps, edges, cells, gw, gh) {
  const EPS = 1e-9;
  const sc = gaps[startIdx];
  const pts = [{ x: sc.x, y: sc.y }];
  let { dx, dy } = getInitialDir(sc);
  let x = sc.x, y = sc.y;
  const maxIter = edges.length * 200 + 2000;
  for (let iter = 0; iter < maxIter; iter++) {
    let minT = Infinity, hitH = false, hitV = false;
    for (const edge of edges) {
      let t;
      if (edge.type === 'h') {
        if (Math.abs(dy) < EPS) continue;
        t = (edge.y - y) / dy;
        if (t < EPS) continue;
        const hx = x + dx * t;
        if (hx < edge.x0 - EPS || hx > edge.x1 + EPS) continue;
      } else {
        if (Math.abs(dx) < EPS) continue;
        t = (edge.x - x) / dx;
        if (t < EPS) continue;
        const hy = y + dy * t;
        if (hy < edge.y0 - EPS || hy > edge.y1 + EPS) continue;
      }
      if (t < minT - EPS) { minT = t; hitH = edge.type === 'h'; hitV = edge.type === 'v'; }
      else if (Math.abs(t - minT) < EPS * 100) {
        if (edge.type === 'h') hitH = true;
        if (edge.type === 'v') hitV = true;
      }
    }
    if (minT === Infinity || minT > 1e6) break;
    x += dx * minT; y += dy * minT;
    x = Math.round(x * 1e6) / 1e6; y = Math.round(y * 1e6) / 1e6;
    pts.push({ x, y });
    if (pts.length > 2 && Math.abs(x - sc.x) < 0.01 && Math.abs(y - sc.y) < 0.01) break;
    if (hitH && hitV) { dx = -dx; dy = -dy; }
    else if (hitH) dy = -dy;
    else if (hitV) dx = -dx;
  }
  return pts;
}

function getAllCycles(cells, gw, gh) {
  const edges = buildEdges(cells, gw, gh);
  const gaps = buildGaps(cells, gw, gh);
  if (gaps.length === 0) return { cycles: [], gaps, edges };
  const vis = new Set(), cycles = [];
  for (let g = 0; g < gaps.length; g++) {
    if (vis.has(g)) continue;
    const pts = tracePath(g, gaps, edges, cells, gw, gh);
    const gapSet = new Set();
    for (const p of pts) {
      const gi = pointToGapIdx(p.x, p.y, gaps);
      if (gi >= 0) { gapSet.add(gi); vis.add(gi); }
    }
    cycles.push({ startGap: g, points: pts, gaps: gapSet });
  }
  return { cycles, gaps, edges };
}

// ========== COLORS ==========
const JOAO = [
  { name: "Preto",       hex: "#1a1a1a" },
  { name: "Rosa",        hex: "#e0738a" },
  { name: "Chartreuse",  hex: "#a0b820" },
  { name: "Verde Lima",  hex: "#78b830" },
  { name: "Roxo",        hex: "#6b2d8b" },
  { name: "Ambar",       hex: "#d9a030" },
  { name: "Rosa Choque", hex: "#e84690" },
  { name: "Magenta",     hex: "#c8186e" },
  { name: "Azul Real",   hex: "#0e5cc0" },
  { name: "Azul Aco",    hex: "#5a93b0" },
  { name: "Cinza Claro", hex: "#b0a89a" },
  { name: "Esmeralda",   hex: "#109878" },
  { name: "Carmesim",    hex: "#b01840" },
];
const JOAO_DEFAULTS = JOAO.filter(c => c.hex !== "#1a1a1a");
const COLORS = JOAO_DEFAULTS.map(c => c.hex);

function subtractInterval(a0, a1, b0, b1) {
  if (b0 >= a1 || b1 <= a0) return [[a0, a1]];
  const r = [];
  if (a0 < b0) r.push([a0, b0]);
  if (b1 < a1) r.push([b1, a1]);
  return r;
}

// ========== MAIN COMPONENT ==========
function KnotMakerMobile() {
  const [cells, setCells] = useState(() => Array.from({ length: 10 }, () => Array(18).fill(true)));
  const [gridW, setGridW] = useState(18);
  const [gridH, setGridH] = useState(10);
  const [editW, setEditW] = useState('');
  const [editH, setEditH] = useState('');
  const [editingW, setEditingW] = useState(false);
  const [editingH, setEditingH] = useState(false);
  const [savedShapes, setSavedShapes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('celtic.savedShapes') || '[]'); }
    catch { return []; }
  });
  const persistShapes = useCallback((next) => {
    setSavedShapes(next);
    try { localStorage.setItem('celtic.savedShapes', JSON.stringify(next)); } catch {}
  }, []);
  const [selGap, setSelGap] = useState(null);
  const [showAll, setShowAll] = useState(true);
  const [cycleStripOpen, setCycleStripOpen] = useState(false);
  const [showNails, setShowNails] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [panX, setPanX] = useState(0);
  const [panY, setPanY] = useState(0);
  const knotWrapRef = useRef(null);
  const [activeTab, setActiveTab] = useState('edit'); // null, 'edit', 'shapes', 'mode'
  const [isLandscape, setIsLandscape] = useState(false);
  useEffect(() => {
    const q = () => setIsLandscape(window.innerWidth > window.innerHeight && window.innerWidth >= 500);
    q();
    window.addEventListener('resize', q);
    window.addEventListener('orientationchange', q);
    return () => {
      window.removeEventListener('resize', q);
      window.removeEventListener('orientationchange', q);
    };
  }, []);
  const [strandMode, setStrandMode] = useState('thin');
  const [cycleColors, setCycleColors] = useState({});
  const [cycleSecondary, setCycleSecondary] = useState({});
  const [palettePopover, setPalettePopover] = useState(null);
  const [visibleCycles, setVisibleCycles] = useState({});
  const [painting, setPainting] = useState(null);
  const [marquee, setMarquee] = useState(null);
  const colorInputRefs = useRef({});
  const colorInputRefs2 = useRef({});
  const longPressTimerRef = useRef(null);
  const longPressFiredRef = useRef(false);
  const pressStartRef = useRef(null);

  useEffect(() => {
    if (!palettePopover) return;
    const close = (e) => {
      if (!e.target.closest?.("[data-palette-pop]") && !e.target.closest?.("[data-palette-trigger]")) setPalettePopover(null);
    };
    document.addEventListener("pointerdown", close);
    return () => document.removeEventListener("pointerdown", close);
  }, [palettePopover]);

  // Two fingers: pinch-zoom + drag to pan the knot. One finger: tap gap dots only (no pan).
  const pinchRef = useRef(null);
  useEffect(() => {
    const el = knotWrapRef.current;
    if (!el) return;
    const captureTwoFinger = (e) => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const t0 = e.touches[0], t1 = e.touches[1];
      const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      const mx = (t0.clientX + t1.clientX) / 2;
      const my = (t0.clientY + t1.clientY) / 2;
      pinchRef.current = { d, z: zoom, mx, my, px: panX, py: panY };
    };
    const onTouchStart = (e) => { captureTwoFinger(e); };
    const onTouchMove = (e) => {
      if (e.touches.length === 2) {
        if (!pinchRef.current) captureTwoFinger(e);
        if (!pinchRef.current) return;
        e.preventDefault();
        const t0 = e.touches[0], t1 = e.touches[1];
        const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        const mx = (t0.clientX + t1.clientX) / 2;
        const my = (t0.clientY + t1.clientY) / 2;
        const scale = d / pinchRef.current.d;
        setZoom(Math.max(0.15, Math.min(5, pinchRef.current.z * scale)));
        setPanX(pinchRef.current.px + (mx - pinchRef.current.mx));
        setPanY(pinchRef.current.py + (my - pinchRef.current.my));
      }
    };
    const onTouchEnd = (e) => {
      if (e.touches.length < 2) pinchRef.current = null;
    };
    el.addEventListener("touchstart", onTouchStart, { passive: false });
    el.addEventListener("touchmove", onTouchMove, { passive: false });
    el.addEventListener("touchend", onTouchEnd);
    el.addEventListener("touchcancel", onTouchEnd);
    return () => {
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchmove", onTouchMove);
      el.removeEventListener("touchend", onTouchEnd);
      el.removeEventListener("touchcancel", onTouchEnd);
    };
  }, [zoom, panX, panY]);

  const W = gridW, H = gridH;

  const loadShape = useCallback((shape) => {
    setCells(shape.cells.map(r => [...r]));
    setGridW(shape.gw); setGridH(shape.gh);
    setSelGap(null); setShowAll(true); setCycleColors({}); setVisibleCycles({});
  }, []);
  const saveCurrentShape = useCallback(() => {
    const name = window.prompt("Name this shape:");
    if (!name?.trim()) return;
    const trimmed = name.trim();
    const snap = { name: trimmed, gw: gridW, gh: gridH, cells: cells.map(r => [...r]) };
    const next = [...savedShapes.filter(s => s.name !== trimmed), snap];
    persistShapes(next);
  }, [cells, gridW, gridH, savedShapes, persistShapes]);
  const deleteShape = useCallback((name) => {
    persistShapes(savedShapes.filter(s => s.name !== name));
  }, [savedShapes, persistShapes]);

  const exportShapes = useCallback(() => {
    const blob = new Blob([JSON.stringify(savedShapes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `celtic-shapes-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  }, [savedShapes]);

  const importFileRef = useRef(null);
  const onImportFile = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("not an array");
        const valid = data.filter(s => s && typeof s.name === "string" && Array.isArray(s.cells) && Number.isInteger(s.gw) && Number.isInteger(s.gh));
        const merged = [...savedShapes];
        for (const s of valid) {
          const i = merged.findIndex(m => m.name === s.name);
          if (i >= 0) merged[i] = s; else merged.push(s);
        }
        persistShapes(merged);
      } catch (err) {
        window.alert(`Could not import: ${err.message}`);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }, [savedShapes, persistShapes]);

  const toggleCell = useCallback((x, y, forceVal) => {
    setCells(prev => {
      const next = prev.map(r => [...r]);
      next[y][x] = forceVal !== undefined ? forceVal : !prev[y][x];
      return next;
    });
    setSelGap(null); setShowAll(true);
  }, []);

  const resizeGrid = useCallback((newW, newH) => {
    setCells(prev => Array.from({length: newH}, (_, y) =>
      Array.from({length: newW}, (_, x) => (y < prev.length && x < (prev[0]?.length || 0)) ? prev[y][x] : false)
    ));
    setGridW(newW); setGridH(newH);
    setSelGap(null); setShowAll(true);
  }, []);

  const { cycles, gaps, edges } = useMemo(() => getAllCycles(cells, gridW, gridH), [cells, gridW, gridH]);
  const active = useMemo(() => selGap !== null ? cycles.find(c => c.gaps.has(selGap)) : null, [selGap, cycles]);

  // Responsive SVG sizing — cellSz is at zoom=1, viewBox scales for zoom
  const svgW = 600, svgH = 600;
  const pad = 40;
  const cellSz = Math.min((svgW - 2 * pad) / W, (svgH - 2 * pad) / H) * 0.74;
  const ox = (svgW - W * cellSz) / 2, oy = (svgH - H * cellSz) / 2;
  // ViewBox: zoom < 1 shows more area (zoom out), zoom > 1 shows less (zoom in)
  const vbW = svgW / zoom, vbH = svgH / zoom;
  const vbX = (svgW - vbW) / 2 - panX / zoom;
  const vbY = (svgH - vbH) / 2 - panY / zoom;

  const toX = useCallback(x => ox + x * cellSz, [ox, cellSz]);
  const toY = useCallback(y => oy + y * cellSz, [oy, cellSz]);

  const gapDots = useMemo(() => gaps.map((g, i) => ({ i, x: toX(g.x), y: toY(g.y) })), [gaps, toX, toY]);

  const gr = Math.max(5, cellSz * 0.13);
  const sw = cellSz * (strandMode === 'full' ? 0.707 : strandMode === 'string' ? 0.12 : 0.45);
  const bgColor = "#0c0f12";

  // Weave grid lines
  const weaveLines = useMemo(() => {
    const lines = [];
    for (let k = -W; k <= H; k++) {
      const kVal = k + 0.5;
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, -k), nMax = Math.min(W - 1, H - k - 2);
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = n + k, cy2 = n + k + 1;
        if (cy1 >= 0 && cy2 < H && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);
      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(x0 + kVal);
        const sx1 = toX(x1), sy1 = toY(x1 + kVal);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        const cuts = [];
        for (let m = -1; m <= W + H; m++) {
          const mVal = m + 0.5;
          const ix = (mVal - kVal) / 2;
          const iy = (mVal + kVal) / 2;
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((k + m + W) % 2 === 1) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    for (let m = 0; m <= W + H - 1; m++) {
      const mVal = m + 0.5;
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, Math.ceil(mVal - H)), nMax = Math.min(W - 1, Math.floor(mVal - 1));
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = m - n - 1, cy2 = m - n;
        if (cy1 >= 0 && cy2 < H && cy1 < H && cy2 >= 0 && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);
      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(mVal - x0);
        const sx1 = toX(x1), sy1 = toY(mVal - x1);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        const cuts = [];
        for (let k = -W; k <= H; k++) {
          const kVal2 = k + 0.5;
          const ix = (mVal - kVal2) / 2;
          const iy = (mVal + kVal2) / 2;
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((k + m + W) % 2 === 0) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    return lines;
  }, [cells, W, H, cellSz, toX, toY]);

  // Strand rendering
  const getCycleColor = useCallback((i) => {
    if (strandMode === 'string') return "#c8a96e";
    return cycleColors[i] || COLORS[i % COLORS.length];
  }, [cycleColors, strandMode]);
  const setCycleColor = useCallback((i, color) => setCycleColors(prev => ({ ...prev, [i]: color })), []);
  const setCycleSecondaryColor = useCallback((i, color) => setCycleSecondary(prev => ({ ...prev, [i]: color })), []);
  const clearCycleSecondary = useCallback((i) => setCycleSecondary(prev => { const n = { ...prev }; delete n[i]; return n; }), []);

  const isCycleVisible = useCallback((i) => {
    if (showAll) return visibleCycles[i] !== false;
    return visibleCycles[i] === true;
  }, [showAll, visibleCycles]);

  const toggleCycle = useCallback((i) => {
    const willBeVisible = !isCycleVisible(i);
    setVisibleCycles(prev => ({ ...prev, [i]: willBeVisible }));
  }, [isCycleVisible]);

  // Corner detection
  const cornerGapSet = useMemo(() => {
    const set = new Set();
    for (let vy = 0; vy <= H; vy++)
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br !== 1) continue;
        let g1, g2;
        if (br) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; }
        else if (bl) { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; }
        else if (tr) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; }
        else { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; }
        const gi1 = pointToGapIdx(g1.x, g1.y, gaps);
        const gi2 = pointToGapIdx(g2.x, g2.y, gaps);
        if (gi1 >= 0) set.add(gi1);
        if (gi2 >= 0) set.add(gi2);
      }
    return set;
  }, [cells, W, H, gaps]);

  // Nail positions
  const nailPositions = useMemo(() => {
    const nails = [];
    for (let i = 0; i < gaps.length; i++) {
      if (!cornerGapSet.has(i))
        nails.push({ x: gaps[i].x, y: gaps[i].y, type: 'edge' });
    }
    for (let vy = 0; vy <= H; vy++)
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br === 1)
          nails.push({ x: vx, y: vy, type: 'corner' });
      }
    return nails;
  }, [cells, W, H, gaps]);

  // Corner arcs
  const cornerArcs = useMemo(() => {
    const arcs = [];
    for (let vy = 0; vy <= H; vy++) {
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br !== 1) continue;
        let g1, g2, sweep;
        if (br) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; sweep = 0; }
        else if (bl) { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; sweep = 1; }
        else if (tr) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; sweep = 1; }
        else { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; sweep = 0; }
        const gi1 = pointToGapIdx(g1.x, g1.y, gaps);
        const gi2 = pointToGapIdx(g2.x, g2.y, gaps);
        const ci1 = gi1 >= 0 ? cycles.findIndex(c => c.gaps.has(gi1)) : -1;
        const ci2 = gi2 >= 0 ? cycles.findIndex(c => c.gaps.has(gi2)) : -1;
        let color = null;
        if (ci1 >= 0 && isCycleVisible(ci1)) color = getCycleColor(ci1);
        else if (ci2 >= 0 && isCycleVisible(ci2)) color = getCycleColor(ci2);
        if (!color) continue;
        const dx = toX(g2.x) - toX(g1.x), dy = toY(g2.y) - toY(g1.y);
        const r = Math.hypot(dx, dy) / 2;
        arcs.push({ sx1: toX(g1.x), sy1: toY(g1.y), sx2: toX(g2.x), sy2: toY(g2.y), r, sweep, color });
      }
    }
    return arcs;
  }, [cells, W, H, gaps, cycles, isCycleVisible, getCycleColor, cellSz, toX, toY]);

  // Crossing coverage
  function getCoveredCrossings(pts) {
    const bsSet = new Set();
    const fsSet = new Set();
    for (let seg = 0; seg < pts.length - 1; seg++) {
      const p1 = pts[seg], p2 = pts[seg + 1];
      const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
      if (sdx === 0 || sdy === 0) continue;
      const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
      const isBS = (sdx === sdy);
      if (isBS) {
        const kVal = p1.y - p1.x;
        for (let mi = -1; mi <= W + H; mi++) {
          const mVal = mi + 0.5;
          const cx = (mVal - kVal) / 2, cy = (mVal + kVal) / 2;
          if (cx > minX + 0.01 && cx < maxX - 0.01 && cy > 0.01 && cy < H - 0.01)
            bsSet.add(`${cx.toFixed(2)},${cy.toFixed(2)}`);
        }
      } else {
        const mVal = p1.y + p1.x;
        for (let ki = -W; ki <= H; ki++) {
          const kVal2 = ki + 0.5;
          const cx = (mVal - kVal2) / 2, cy = (mVal + kVal2) / 2;
          if (cx > minX + 0.01 && cx < maxX - 0.01 && cy > 0.01 && cy < H - 0.01)
            fsSet.add(`${cx.toFixed(2)},${cy.toFixed(2)}`);
        }
      }
    }
    return { bsSet, fsSet };
  }

  function renderStrandSVG(pts, color, crossingMap) {
    const elements = [];
    const lineW = sw;
    const gap = strandMode === 'string' ? cellSz * 0.16 : sw / 2;
    for (let seg = 0; seg < pts.length - 1; seg++) {
      const p1 = pts[seg], p2 = pts[seg + 1];
      const sx1 = toX(p1.x), sy1 = toY(p1.y);
      const sx2 = toX(p2.x), sy2 = toY(p2.y);
      const ddx = sx2 - sx1, ddy = sy2 - sy1;
      const len = Math.hypot(ddx, ddy);
      if (len < 0.5) continue;
      const ux = ddx / len, uy = ddy / len;
      const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
      const p1Edge = isOnBoundary(p1.x, p1.y, cells, W, H);
      const p2Edge = isOnBoundary(p2.x, p2.y, cells, W, H);
      const p1gi = pointToGapIdx(p1.x, p1.y, gaps);
      const p2gi = pointToGapIdx(p2.x, p2.y, gaps);
      const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (p1gi >= 0 && cornerGapSet.has(p1gi) && p2gi >= 0 && cornerGapSet.has(p2gi) && segLen < 1.1) continue;
      if (sdx === 0 || sdy === 0) {
        elements.push({ type: 'strand', x1: sx1, y1: sy1, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: p1Edge, edgeEnd: p2Edge });
        continue;
      }
      const isBS = (sdx === sdy);
      const cuts = [];
      const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
      if (isBS) {
        const kVal = p1.y - p1.x;
        const ki = Math.round(kVal - 0.5);
        for (let mi = -1; mi <= W + H; mi++) {
          const mVal = mi + 0.5;
          const ix = (mVal - kVal) / 2, iy = (mVal + kVal) / 2;
          if (ix > minX + 0.01 && ix < maxX - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((ki + mi + W) % 2 === 1) {
              if (!crossingMap || crossingMap.forBS.has(`${ix.toFixed(2)},${iy.toFixed(2)}`))
                cuts.push({ sx: toX(ix), sy: toY(iy) });
            }
          }
        }
      } else {
        const mVal = p1.y + p1.x;
        const mi = Math.round(mVal - 0.5);
        for (let ki = -W; ki <= H; ki++) {
          const kVal2 = ki + 0.5;
          const ix = (mVal - kVal2) / 2, iy = (mVal + kVal2) / 2;
          if (ix > minX + 0.01 && ix < maxX - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((ki + mi + W) % 2 === 0) {
              if (!crossingMap || crossingMap.forFS.has(`${ix.toFixed(2)},${iy.toFixed(2)}`))
                cuts.push({ sx: toX(ix), sy: toY(iy) });
            }
          }
        }
      }
      cuts.sort((a, b) => (a.sx - sx1) * ux + (a.sy - sy1) * uy - ((b.sx - sx1) * ux + (b.sy - sy1) * uy));
      let cx = sx1, cy = sy1;
      let isFirst = true;
      for (const cut of cuts) {
        const gsx = cut.sx - ux * gap, gsy = cut.sy - uy * gap;
        const proj = (gsx - cx) * ux + (gsy - cy) * uy;
        if (proj > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: gsx, y2: gsy, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: false });
        cx = cut.sx + ux * gap; cy = cut.sy + uy * gap;
        isFirst = false;
      }
      const projEnd = (sx2 - cx) * ux + (sy2 - cy) * uy;
      if (projEnd > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: p2Edge });
    }
    return elements;
  }

  const renderElements = useMemo(() => {
    try {
      const cycleCrossings = [];
      for (let i = 0; i < cycles.length; i++) {
        const pts = isCycleVisible(i) ? cycles[i].points : [];
        cycleCrossings.push(pts.length >= 2 ? getCoveredCrossings(pts) : { bsSet: new Set(), fsSet: new Set() });
      }
      const allBS = new Set(), allFS = new Set();
      for (let j = 0; j < cycles.length; j++) {
        for (const k of cycleCrossings[j].bsSet) allBS.add(k);
        for (const k of cycleCrossings[j].fsSet) allFS.add(k);
      }
      const crossingMap = { forBS: allFS, forFS: allBS };
      const arcLen = (pts) => {
        let t = 0;
        for (let s = 0; s < pts.length - 1; s++) t += Math.hypot(pts[s+1].x - pts[s].x, pts[s+1].y - pts[s].y);
        return t;
      };
      const splitPtsAtArc = (pts, arc) => {
        if (pts.length < 2 || arc <= 0) return [[], pts];
        let acc = 0;
        for (let s = 0; s < pts.length - 1; s++) {
          const d = Math.hypot(pts[s+1].x - pts[s].x, pts[s+1].y - pts[s].y);
          if (acc + d >= arc) {
            const t = (arc - acc) / d;
            const split = { x: pts[s].x + (pts[s+1].x - pts[s].x) * t, y: pts[s].y + (pts[s+1].y - pts[s].y) * t };
            return [pts.slice(0, s+1).concat([split]), [split].concat(pts.slice(s+1))];
          }
          acc += d;
        }
        return [pts, []];
      };
      const els = [];
      for (let i = 0; i < cycles.length; i++) {
        if (!isCycleVisible(i)) continue;
        const pts = cycles[i].points;
        if (!pts || pts.length < 2) continue;
        const c1 = getCycleColor(i);
        const c2 = strandMode === 'string' ? null : cycleSecondary[i];
        if (c2) {
          const splitArc = arcLen(pts) * 0.5;
          const [first, second] = splitPtsAtArc(pts, splitArc);
          if (first.length >= 2) els.push(...renderStrandSVG(first, c1, crossingMap));
          if (second.length >= 2) els.push(...renderStrandSVG(second, c2, crossingMap));
        } else {
          els.push(...renderStrandSVG(pts, c1, crossingMap));
        }
      }
      els.sort((a, b) => a.z - b.z);
      return els;
    } catch(e) { console.error('RENDER ERROR:', e); return []; }
  }, [cycles, isCycleVisible, cells, W, H, cellSz, toX, toY, sw, cycleColors, cycleSecondary, strandMode]);

  // String stats
  const stringStats = useMemo(() => {
    const stats = [];
    let totalLen = 0;
    for (let i = 0; i < cycles.length; i++) {
      const pts = cycles[i].points;
      if (!pts || pts.length < 2) { stats.push(null); continue; }
      let len = 0;
      for (let s = 0; s < pts.length - 1; s++) len += Math.hypot(pts[s+1].x - pts[s].x, pts[s+1].y - pts[s].y);
      const c1 = getCycleColor(i);
      const c2 = cycleSecondary[i] || null;
      const half = len * 0.5;
      stats.push({ len, c1, c2, firstLen: c2 ? half : len, secondLen: c2 ? half : 0 });
      totalLen += len;
    }
    const byColor = {};
    for (const s of stats) {
      if (!s) continue;
      byColor[s.c1] = (byColor[s.c1] || 0) + s.firstLen;
      if (s.c2) byColor[s.c2] = (byColor[s.c2] || 0) + s.secondLen;
    }
    return { perCycle: stats, totalLen, byColor };
  }, [cycles, getCycleColor, cycleSecondary]);

  /** Per-cycle share of total string length — answers “8 cycles but two hog the length?” */
  const cycleBalance = useMemo(() => {
    const { perCycle, totalLen } = stringStats;
    if (cycles.length === 0 || totalLen <= 0) return null;
    const pcts = cycles.map((_, i) => {
      const s = perCycle[i];
      if (!s || !s.len) return 0;
      return (s.len / totalLen) * 100;
    });
    const minP = Math.min(...pcts);
    const maxP = Math.max(...pcts);
    const spread = maxP - minP;
    const fair = spread <= 12;
    const summary = fair
      ? `Roughly balanced (each cycle ~${(100 / cycles.length).toFixed(0)}% of length).`
      : `Uneven: shortest cycle ${minP.toFixed(0)}% of total length, longest ${maxP.toFixed(0)}%.`;
    // Balance rating: green / orange / red
    let rating = 'red';
    if (cycles.length === 2) rating = 'green';
    else if (fair) rating = 'green';
    else if (spread <= 25) rating = 'orange';
    const ratingColor = rating === 'green' ? '#4aaa78' : rating === 'orange' ? '#d4a03c' : '#c85050';
    return { pcts, minP, maxP, spread, fair, summary, rating, ratingColor };
  }, [stringStats, cycles]);

  const clickGap = useCallback(g => {
    const ci = cycles.findIndex(c => c.gaps.has(g));
    if (ci < 0) return;
    setSelGap(g);
    if (showAll) setShowAll(false);
    setVisibleCycles(prev => ({ ...prev, [ci]: true }));
  }, [cycles, showAll]);

  // Boundary edges
  const boundaryEdges = useMemo(() => {
    return edges.map(e => {
      if (e.type === 'h') return { x1: toX(e.x0), y1: toY(e.y), x2: toX(e.x1), y2: toY(e.y) };
      return { x1: toX(e.x), y1: toY(e.y0), x2: toX(e.x), y2: toY(e.y1) };
    });
  }, [edges, toX, toY]);

  // Edge-run labels
  const edgeRuns = useMemo(() => {
    const isOn = (x, y) => x >= 0 && y >= 0 && x < gridW && y < gridH && !!cells[y]?.[x];
    const runs = [];
    for (let y = 0; y <= gridH; y++) {
      let s = null, filledAbove = false;
      for (let x = 0; x <= gridW; x++) {
        const a = isOn(x, y - 1), b = isOn(x, y);
        const isEdge = x < gridW && (a !== b);
        if (isEdge) {
          if (s === null) { s = x; filledAbove = a; }
        } else if (s !== null) {
          runs.push({ orient: "h", y, x0: s, x1: x, len: x - s, filledAbove });
          s = null;
        }
      }
    }
    for (let x = 0; x <= gridW; x++) {
      let s = null, filledLeft = false;
      for (let y = 0; y <= gridH; y++) {
        const a = isOn(x - 1, y), b = isOn(x, y);
        const isEdge = y < gridH && (a !== b);
        if (isEdge) {
          if (s === null) { s = y; filledLeft = a; }
        } else if (s !== null) {
          runs.push({ orient: "v", x, y0: s, y1: y, len: y - s, filledLeft });
          s = null;
        }
      }
    }
    return runs;
  }, [cells, gridW, gridH]);

  // Editor pointer handling
  const editorBaseCellSize = useMemo(() => {
    const w = typeof window !== 'undefined' ? window.innerWidth : 400;
    const availW = isLandscape
      ? Math.max(220, Math.min(w * 0.56 - 28, 640))
      : Math.min(w - 24, 600);
    return Math.max(28, Math.floor(availW / gridW));
  }, [gridW, isLandscape]);
  const [editorZoom, setEditorZoom] = useState(1);
  const editorCellSize = Math.round(editorBaseCellSize * editorZoom);
  /** Padding around the cell grid so edge length badges sit outside the frame and are not clipped. */
  const editorEdgePad = useMemo(
    () => Math.max(24, Math.min(48, Math.round(editorCellSize * 0.58))),
    [editorCellSize]
  );
  const editorRef = useRef(null);
  const editorScrollWrapRef = useRef(null);
  const editorZoomRef = useRef(1);
  editorZoomRef.current = editorZoom;
  const editPinchGestureRef = useRef(null);
  const cellsRef = useRef(cells);
  cellsRef.current = cells;

  const EDITOR_SCROLL_STEP = 100;
  const scrollEditorGrid = useCallback((dx, dy) => {
    const el = editorScrollWrapRef.current;
    if (!el) return;
    el.scrollBy({ left: dx, top: dy, behavior: "auto" });
  }, []);

  /** Zoom so the cell grid fits inside the editor window (measured on the scroll box). */
  const fitEditorZoomToView = useCallback((mode) => {
    const wrap = editorScrollWrapRef.current;
    if (!wrap || gridW < 1 || gridH < 1 || editorBaseCellSize < 1) return;
    const pad = 8;
    const labelMargin = Math.max(48, Math.round(editorBaseCellSize * 1.25));
    const cw = Math.max(1, wrap.clientWidth - pad - labelMargin);
    const ch = Math.max(1, wrap.clientHeight - pad - labelMargin);
    const zW = Math.floor(cw / gridW) / editorBaseCellSize;
    const zH = Math.floor(ch / gridH) / editorBaseCellSize;
    let z = 1;
    if (mode === "width") z = zW;
    else if (mode === "height") z = zH;
    else z = Math.min(zW, zH);
    if (!Number.isFinite(z) || z <= 0) return;
    setEditorZoom(Math.max(0.25, Math.min(4, +z.toFixed(4))));
    requestAnimationFrame(() => {
      wrap.scrollLeft = 0;
      wrap.scrollTop = 0;
    });
  }, [editorBaseCellSize, gridW, gridH]);

  useEffect(() => {
    const el = editorScrollWrapRef.current;
    if (!el) return;
    const captureTwoFinger = (e) => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const t0 = e.touches[0], t1 = e.touches[1];
      const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      if (d < 8) return;
      editPinchGestureRef.current = { d, z: editorZoomRef.current };
    };
    const onTouchStart = (e) => { captureTwoFinger(e); };
    const onTouchMove = (e) => {
      if (e.touches.length === 2) {
        if (!editPinchGestureRef.current) captureTwoFinger(e);
        if (!editPinchGestureRef.current) return;
        e.preventDefault();
        const t0 = e.touches[0], t1 = e.touches[1];
        const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        const scale = d / editPinchGestureRef.current.d;
        setEditorZoom(Math.max(0.25, Math.min(4, editPinchGestureRef.current.z * scale)));
      }
    };
    const onTouchEnd = (e) => {
      if (e.touches.length < 2) editPinchGestureRef.current = null;
    };
    el.addEventListener("touchstart", onTouchStart, { passive: false, capture: true });
    el.addEventListener("touchmove", onTouchMove, { passive: false, capture: true });
    el.addEventListener("touchend", onTouchEnd, { capture: true });
    el.addEventListener("touchcancel", onTouchEnd, { capture: true });
    return () => {
      el.removeEventListener("touchstart", onTouchStart, { capture: true });
      el.removeEventListener("touchmove", onTouchMove, { capture: true });
      el.removeEventListener("touchend", onTouchEnd, { capture: true });
      el.removeEventListener("touchcancel", onTouchEnd, { capture: true });
    };
  }, [activeTab]);

  const getCellFromPointer = useCallback((e) => {
    const rect = editorRef.current?.getBoundingClientRect();
    if (!rect) return null;
    const clientX = e.clientX ?? e.touches?.[0]?.clientX;
    const clientY = e.clientY ?? e.touches?.[0]?.clientY;
    if (clientX == null) return null;
    const px = clientX - rect.left - editorEdgePad;
    const py = clientY - rect.top - editorEdgePad;
    const x = Math.floor(px / editorCellSize);
    const y = Math.floor(py / editorCellSize);
    if (x >= 0 && x < gridW && y >= 0 && y < gridH) return { x, y };
    return null;
  }, [editorCellSize, editorEdgePad, gridW, gridH]);

  const onEditorPointerDown = useCallback((e) => {
    if (e.pointerType === "touch" && e.isPrimary === false) return;
    e.preventDefault();
    editorRef.current?.setPointerCapture?.(e.pointerId);
    const c = getCellFromPointer(e);
    if (!c) return;
    const val = !cellsRef.current[c.y][c.x];
    setMarquee({ x0: c.x, y0: c.y, x1: c.x, y1: c.y, val });
  }, [getCellFromPointer]);

  const onEditorPointerMove = useCallback((e) => {
    if (!marquee) return;
    const rect = editorRef.current?.getBoundingClientRect();
    if (!rect) return;
    const clientX = e.clientX ?? e.touches?.[0]?.clientX;
    const clientY = e.clientY ?? e.touches?.[0]?.clientY;
    if (clientX == null) return;
    const px = clientX - rect.left - editorEdgePad;
    const py = clientY - rect.top - editorEdgePad;
    const x = Math.max(0, Math.min(gridW - 1, Math.floor(px / editorCellSize)));
    const y = Math.max(0, Math.min(gridH - 1, Math.floor(py / editorCellSize)));
    if (x === marquee.x1 && y === marquee.y1) return;
    setMarquee({ ...marquee, x1: x, y1: y });
  }, [marquee, editorCellSize, editorEdgePad, gridW, gridH]);

  const onEditorPointerUp = useCallback(() => {
    if (!marquee) return;
    const { x0, y0, x1, y1, val } = marquee;
    const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
    const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    setCells(prev => prev.map((row, y) =>
      row.map((c, x) => (x >= xa && x <= xb && y >= ya && y <= yb) ? val : c)
    ));
    setSelGap(null); setShowAll(true);
    setMarquee(null);
  }, [marquee]);

  const landscapeSplit = isLandscape;

  const knotViewportEl = (
      <div ref={knotWrapRef} className="knot-viewport" style={{
        flex: 1, minHeight: 0, background: bgColor, overflow: "hidden",
        display: "flex", alignItems: "center", justifyContent: "center",
        touchAction: "none", position: "relative",
      }}>
        <div className="knot-zoom-btns" style={{ position: "absolute", top: 8, right: 8, zIndex: 10, display: "flex", gap: 4 }}>
          <button onClick={() => { setZoom(1); setPanX(0); setPanY(0); }}
            style={{ width: 36, height: 36, background: "rgba(22,19,15,0.85)", border: "1px solid var(--hair)", color: "var(--accent)", fontSize: 10, fontWeight: 600, letterSpacing: 0.8, cursor: "pointer", fontFamily: "inherit", borderRadius: 4 }}>FIT</button>
          <button onClick={() => setZoom(z => Math.max(0.15, +(z / 1.3).toFixed(2)))}
            style={{ width: 36, height: 36, background: "rgba(22,19,15,0.85)", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 18, cursor: "pointer", fontFamily: "inherit", borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center" }}>-</button>
          <button onClick={() => setZoom(z => Math.min(5, +(z * 1.3).toFixed(2)))}
            style={{ width: 36, height: 36, background: "rgba(22,19,15,0.85)", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 18, cursor: "pointer", fontFamily: "inherit", borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
        </div>
        <svg
          width="100%" height="100%"
          viewBox={`${vbX} ${vbY} ${vbW} ${vbH}`}
          preserveAspectRatio="xMidYMid meet"
          style={{ display: "block" }}
        >
          <defs>
            <filter id="glo"><feGaussianBlur stdDeviation="2" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>

          {/* Boundary edges */}
          {boundaryEdges.map((e, i) => (
            <line key={`be${i}`} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="#2a2519" strokeWidth={1.5} />
          ))}

          {/* Strands */}
          {renderElements.map((el, i) => (
            <line key={i} x1={el.x1} y1={el.y1} x2={el.x2} y2={el.y2}
              stroke={el.color} strokeWidth={el.w} strokeLinecap="butt" />
          ))}

          {/* Corner arcs */}
          {cornerArcs.map((arc, i) => (
            <path key={`ca${i}`} d={`M${arc.sx1},${arc.sy1} A${arc.r},${arc.r} 0 0,${arc.sweep} ${arc.sx2},${arc.sy2}`}
              fill="none" stroke={arc.color} strokeWidth={sw} strokeLinecap="butt" />
          ))}

          {/* Rounded caps */}
          {renderElements.filter(el => el.type === 'strand' && (el.edgeStart || el.edgeEnd)).map((el, i) => {
            const r = el.w / 2;
            const caps = [];
            if (el.edgeStart) caps.push(<circle key={`es${i}`} cx={el.x1} cy={el.y1} r={r} fill={el.color} />);
            if (el.edgeEnd) caps.push(<circle key={`ee${i}`} cx={el.x2} cy={el.y2} r={r} fill={el.color} />);
            return caps;
          })}

          {/* Gap dots — larger hit targets for mobile */}
          {gapDots.map(g => {
            const sel = selGap === g.i;
            const ci = cycles.findIndex(c => c.gaps.has(g.i));
            const vis = ci >= 0 && isCycleVisible(ci);
            const col = vis && ci >= 0 ? getCycleColor(ci) : "#2e2920";
            return (
              <g key={`g${g.i}`}>
                <circle cx={g.x} cy={g.y} r={gr * 2.5} fill="transparent" style={{ cursor: "pointer" }}
                  onClick={() => clickGap(g.i)} />
                <circle cx={g.x} cy={g.y} r={sel ? gr * 1.15 : gr * 0.65} fill={col} opacity={vis || sel ? 1 : 0.45}
                  style={{ pointerEvents: "none" }} filter={sel ? "url(#glo)" : undefined} />
                {sel && <circle cx={g.x} cy={g.y} r={gr * 2} fill="none" stroke="#c8a96e" strokeWidth={1.2} opacity={0.4} style={{ pointerEvents: "none" }} />}
              </g>
            );
          })}

          {/* Nails */}
          {showNails && nailPositions.map((n, i) => (
            <circle key={`nail${i}`} cx={toX(n.x)} cy={toY(n.y)} r={4}
              fill={n.type === 'corner' ? "#ff4444" : "#44ff44"} opacity={0.8} style={{ pointerEvents: "none" }} />
          ))}
        </svg>
      </div>
  );

  const statsBarEl = (
      <div className="stats-bar" style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 12px", borderBottom: "1px solid var(--hair)", background: "var(--ink-2)", fontSize: 13 }}>
        {cycleBalance && (
          <span style={{
            width: 10, height: 10, borderRadius: "50%",
            background: cycleBalance.ratingColor,
            display: "inline-block", flexShrink: 0,
            boxShadow: `0 0 4px ${cycleBalance.ratingColor}80`,
          }} title={cycleBalance.summary} />
        )}
        <span style={{ color: "var(--accent)", fontWeight: 700, whiteSpace: "nowrap" }}>
          {cycles.length}
        </span>
        <span style={{ color: "var(--bone-dim)", fontSize: 11 }}>
          {cycles.length === 1 ? "cycle" : "cycles"}
        </span>
        {selGap !== null && active && (
          <>
            <span style={{ color: "var(--hair)" }}>|</span>
            <span style={{ color: "#9a8e78", whiteSpace: "nowrap", fontSize: 11 }}>{active.gaps.size} gaps</span>
          </>
        )}
      </div>
  );

  const cycleStripEl = (cycles.length > 0 && cycles.length <= 30) ? (
        <div style={{ borderBottom: "1px solid var(--hair)", background: "var(--ink-2)" }}>
          <button onClick={() => setCycleStripOpen(o => !o)}
            style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "6px 12px", background: "transparent", border: "none", color: "var(--bone-dim)",
              fontSize: 11, fontFamily: "inherit", cursor: "pointer", letterSpacing: 0.5 }}>
            <span>Colours ({cycles.length})</span>
            <span style={{ fontSize: 14 }}>{cycleStripOpen ? "▾" : "▸"}</span>
          </button>
          {cycleStripOpen && <div className="cycle-strip" style={{ padding: "4px 12px 8px" }}>
          <button
            onClick={() => { setShowAll(true); setSelGap(null); setVisibleCycles({}); }}
            className="cycle-btn"
            style={{ background: showAll ? "var(--accent)" : "transparent", color: showAll ? "var(--ink)" : "var(--bone-dim)", borderColor: showAll ? "var(--accent)" : "var(--hair)", fontSize: 10, letterSpacing: 1 }}>
            ALL
          </button>
          {cycles.map((c, i) => {
            const vis = isCycleVisible(i);
            const col = getCycleColor(i);
            const openPicker = () => setPalettePopover({ i, kind: "primary" });
            const clearLongPress = () => {
              if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
              pressStartRef.current = null;
            };
            return (
              <div key={i} style={{ position: "relative", display: "inline-block" }}>
                <button
                  data-palette-trigger
                  className="cycle-btn"
                  onClick={() => {
                    if (longPressFiredRef.current) { longPressFiredRef.current = false; return; }
                    toggleCycle(i);
                  }}
                  onContextMenu={(e) => { e.preventDefault(); openPicker(); }}
                  onPointerDown={(e) => {
                    pressStartRef.current = { x: e.clientX, y: e.clientY };
                    longPressFiredRef.current = false;
                    longPressTimerRef.current = setTimeout(() => {
                      longPressFiredRef.current = true;
                      longPressTimerRef.current = null;
                      openPicker();
                    }, 450);
                  }}
                  onPointerUp={clearLongPress}
                  onPointerLeave={clearLongPress}
                  onPointerCancel={clearLongPress}
                  onPointerMove={(e) => {
                    const s = pressStartRef.current;
                    if (s && (Math.abs(e.clientX - s.x) > 5 || Math.abs(e.clientY - s.y) > 5)) clearLongPress();
                  }}
                  style={{
                    background: vis ? col : "transparent",
                    color: vis ? "#000" : "#6a6050",
                    borderColor: vis ? col : "#332e24",
                    opacity: vis ? 1 : 0.5,
                  }}>
                  {i + 1}
                </button>
                <input type="color" ref={el => { colorInputRefs.current[i] = el; }} value={col}
                  onChange={(e) => setCycleColor(i, e.target.value)}
                  style={{ position: "absolute", left: 0, top: 0, width: 1, height: 1, opacity: 0, pointerEvents: "none" }} />
                {palettePopover && palettePopover.i === i && (
                  <div data-palette-pop style={{
                    position: "absolute", bottom: "100%", left: 0, marginBottom: 8, zIndex: 50,
                    background: "var(--ink-2)", border: "1px solid var(--hair)", padding: 10,
                    display: "grid", gridTemplateColumns: "repeat(7, 32px)", gap: 8,
                    boxShadow: "0 8px 24px rgba(0,0,0,0.6)",
                  }}>
                    {JOAO.map(s => (
                      <button key={s.hex} title={s.name}
                        onClick={() => {
                          if (palettePopover.kind === "primary") setCycleColor(i, s.hex);
                          else setCycleSecondaryColor(i, s.hex);
                          setPalettePopover(null);
                        }}
                        style={{ width: 32, height: 32, padding: 0, background: s.hex, border: "1px solid #00000050", cursor: "pointer", borderRadius: 3 }}
                      />
                    ))}
                    <button
                      onClick={() => {
                        if (palettePopover.kind === "primary") colorInputRefs.current[i]?.click();
                        else colorInputRefs2.current[i]?.click();
                        setPalettePopover(null);
                      }}
                      style={{ gridColumn: "span 7", marginTop: 4, background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 11, padding: "8px", cursor: "pointer", letterSpacing: 1, fontFamily: "inherit", textTransform: "uppercase" }}>
                      Custom...
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>}
        </div>
  ) : null;

  const tabPanelsEl = (
    <>
      {activeTab === 'edit' && (
        <div className="panel" style={{ padding: 12, background: "var(--ink-2)", borderBottom: "1px solid var(--hair)", flex: 1, display: "flex", flexDirection: "column", minHeight: 0, overflow: "hidden" }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 11, color: "var(--bone-dim)", letterSpacing: 1 }}>W</span>
              <div className="stepper">
                <button onClick={() => { if (gridW > 3) resizeGrid(gridW - 1, gridH); }}>-</button>
                <input type="number" min="3" max="100" value={editingW ? editW : gridW}
                  onFocus={e => { setEditingW(true); setEditW(String(gridW)); e.target.select(); }}
                  onChange={e => { setEditW(e.target.value); }}
                  onBlur={e => { setEditingW(false); const v = parseInt(editW, 10); if (!isNaN(v) && v >= 3 && v <= 100) resizeGrid(v, gridH); }}
                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />
                <button onClick={() => { if (gridW < 100) resizeGrid(gridW + 1, gridH); }}>+</button>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <span style={{ fontSize: 11, color: "var(--bone-dim)", letterSpacing: 1 }}>H</span>
              <div className="stepper">
                <button onClick={() => { if (gridH > 3) resizeGrid(gridW, gridH - 1); }}>-</button>
                <input type="number" min="3" max="100" value={editingH ? editH : gridH}
                  onFocus={e => { setEditingH(true); setEditH(String(gridH)); e.target.select(); }}
                  onChange={e => { setEditH(e.target.value); }}
                  onBlur={e => { setEditingH(false); const v = parseInt(editH, 10); if (!isNaN(v) && v >= 3 && v <= 100) resizeGrid(gridW, v); }}
                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />
                <button onClick={() => { if (gridH < 100) resizeGrid(gridW, gridH + 1); }}>+</button>
              </div>
            </div>
            <div style={{ flex: 1 }} />
            <button onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(true))); }}
              style={{ padding: "8px 14px", background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 12, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Fill</button>
            <button onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(false))); }}
              style={{ padding: "8px 14px", background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 12, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Clear</button>
          </div>
          <div className="editor-viewport-frame">
            <div className="editor-toolbar-rows">
            <div className="editor-zoom-row">
            <button type="button" className="editor-zoom-btn" aria-label="Zoom out"
              onClick={() => setEditorZoom(z => Math.max(0.25, +(z - 0.2).toFixed(2)))}>−</button>
            <button type="button" className="editor-zoom-btn" aria-label="Zoom in"
              onClick={() => setEditorZoom(z => Math.min(4, +(z + 0.2).toFixed(2)))}>+</button>
            <button type="button" className="editor-zoom-reset" onClick={() => setEditorZoom(1)}>1:1</button>
            <button type="button" className="editor-zoom-reset" onClick={() => fitEditorZoomToView("width")}>Fit W</button>
            <button type="button" className="editor-zoom-reset" onClick={() => fitEditorZoomToView("height")}>Fit H</button>
            <button type="button" className="editor-zoom-reset" onClick={() => fitEditorZoomToView("both")}>Fit all</button>
            </div>
            <div className="editor-toolbar-sep" />
            <div className="editor-scroll-cluster" role="toolbar" aria-label="Scroll cell grid">
            <button type="button" className="editor-scroll-btn" aria-label="Scroll left"
              onClick={() => scrollEditorGrid(-EDITOR_SCROLL_STEP, 0)}>
              <span className="editor-scroll-btn__arrow" aria-hidden>◀</span>
            </button>
            <button type="button" className="editor-scroll-btn" aria-label="Scroll up"
              onClick={() => scrollEditorGrid(0, -EDITOR_SCROLL_STEP)}>
              <span className="editor-scroll-btn__arrow" aria-hidden>▲</span>
            </button>
            <button type="button" className="editor-scroll-btn" aria-label="Scroll down"
              onClick={() => scrollEditorGrid(0, EDITOR_SCROLL_STEP)}>
              <span className="editor-scroll-btn__arrow" aria-hidden>▼</span>
            </button>
            <button type="button" className="editor-scroll-btn" aria-label="Scroll right"
              onClick={() => scrollEditorGrid(EDITOR_SCROLL_STEP, 0)}>
              <span className="editor-scroll-btn__arrow" aria-hidden>▶</span>
            </button>
            </div>
            </div>
          <div
            ref={editorScrollWrapRef}
            className="editor-scroll-wrap"
            onTouchStart={(e) => { if (e.touches.length >= 2) setMarquee(null); }}
          >
          <div ref={editorRef}
            onPointerDown={onEditorPointerDown} onPointerMove={onEditorPointerMove} onPointerUp={onEditorPointerUp} onPointerCancel={onEditorPointerUp}
            style={{
              position: "relative", display: "inline-block",
              padding: editorEdgePad,
              userSelect: "none", touchAction: "none", cursor: "crosshair",
            }}>
            <div style={{
              display: "inline-grid", gridTemplateColumns: `repeat(${gridW}, ${editorCellSize}px)`,
              border: "2px solid #5a4d32", borderRadius: 4, background: "#0c0f12",
              boxShadow: "inset 0 0 0 1px rgba(232,196,120,0.12)",
              position: "relative",
              width: gridW * editorCellSize, minWidth: gridW * editorCellSize,
            }}>
            {cells.flatMap((row, y) => row.map((on, x) => (
              <div key={`${x},${y}`} style={{
                width: editorCellSize, height: editorCellSize,
                background: on ? "#2d523f" : "#14110d",
                border: "1px solid #2a2419",
              }} />
            )))}
            {edgeRuns.map((r, i) => {
              if (r.orient === "h") {
                return (
                  <div key={`eb-h${i}`} style={{
                    position: "absolute", pointerEvents: "none", zIndex: 2,
                    left: r.x0 * editorCellSize, top: r.y * editorCellSize - 1.5,
                    width: (r.x1 - r.x0) * editorCellSize, height: 3,
                    background: "linear-gradient(180deg, #f0d78c 0%, #c9a050 100%)",
                    boxShadow: "0 0 0 1px rgba(0,0,0,0.35)",
                  }} />
                );
              }
              return (
                <div key={`eb-v${i}`} style={{
                  position: "absolute", pointerEvents: "none", zIndex: 2,
                  left: r.x * editorCellSize - 1.5, top: r.y0 * editorCellSize,
                  width: 3, height: (r.y1 - r.y0) * editorCellSize,
                  background: "linear-gradient(90deg, #f0d78c 0%, #c9a050 100%)",
                  boxShadow: "0 0 0 1px rgba(0,0,0,0.35)",
                }} />
              );
            })}
            {edgeRuns.map((r, i) => {
              const badgeFont = Math.max(11, Math.min(17, Math.round(editorCellSize * 0.38)));
              const hOff = Math.max(12, Math.round(editorCellSize * 0.34));
              const vOff = Math.max(11, Math.round(editorCellSize * 0.3));
              const labelStyle = {
                position: "absolute", pointerEvents: "none", zIndex: 3,
                fontSize: badgeFont, fontFamily: "inherit", fontWeight: 700,
                color: "#e8c46c",
                lineHeight: 1,
                letterSpacing: 0.3,
                textShadow: "0 1px 3px rgba(0,0,0,0.7)",
              };
              if (r.orient === "h") {
                const cx = ((r.x0 + r.x1) / 2) * editorCellSize;
                const edgeY = r.y * editorCellSize;
                const top = edgeY + (r.filledAbove ? hOff : -hOff);
                return (
                  <div key={`h${i}`} style={{ ...labelStyle, left: cx, top, transform: "translate(-50%, -50%)" }}>{r.len}</div>
                );
              }
              const cy = ((r.y0 + r.y1) / 2) * editorCellSize;
              const edgeX = r.x * editorCellSize;
              const left = edgeX + (r.filledLeft ? vOff : -vOff);
              return (
                <div key={`v${i}`} style={{ ...labelStyle, left, top: cy, transform: "translate(-50%, -50%)" }}>{r.len}</div>
              );
            })}
            {marquee && (() => {
              const xa = Math.min(marquee.x0, marquee.x1), xb = Math.max(marquee.x0, marquee.x1);
              const ya = Math.min(marquee.y0, marquee.y1), yb = Math.max(marquee.y0, marquee.y1);
              return (
                <div style={{
                  position: "absolute", pointerEvents: "none", zIndex: 4,
                  left: xa * editorCellSize, top: ya * editorCellSize,
                  width: (xb - xa + 1) * editorCellSize, height: (yb - ya + 1) * editorCellSize,
                  background: marquee.val ? "rgba(74,170,120,0.25)" : "rgba(200,80,80,0.22)",
                  border: `1px solid ${marquee.val ? "#4aaa78" : "#c85050"}`,
                }} />
              );
            })()}
            </div>
          </div>
          </div>
          </div>
        </div>
      )}

      {activeTab === 'shapes' && (
        <div className="panel" style={{ padding: 12, background: "var(--ink-2)", borderBottom: "1px solid var(--hair)" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
            <button onClick={saveCurrentShape}
              style={{ padding: "10px 16px", background: "var(--accent)", color: "var(--ink)", border: "none", fontSize: 13, fontWeight: 600, letterSpacing: 1.4, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Save</button>
            <button onClick={exportShapes}
              style={{ padding: "10px 16px", background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 12, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Export</button>
            <button onClick={() => importFileRef.current?.click()}
              style={{ padding: "10px 16px", background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 12, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Import</button>
            <input ref={importFileRef} type="file" accept="application/json" onChange={onImportFile} style={{ display: "none" }} />
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {['rectangle', 'L-shape', 'staircase-boot', 'cross'].map(name => (
              <span key={name} className="knm-chip" onClick={() => {
                const s = makePreset(name, gridW, gridH);
                setCells(s.cells); setGridW(s.gw); setGridH(s.gh);
                setSelGap(null); setShowAll(true); setCycleColors({}); setVisibleCycles({});
              }}>
                {name}
              </span>
            ))}
          </div>
          {savedShapes.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 10 }}>
              {savedShapes.map(s => (
                <span key={s.name} className="knm-chip" onClick={() => loadShape(s)}>
                  <span>{s.name}</span>
                  <button className="knm-chip-x" onClick={(e) => { e.stopPropagation(); if (window.confirm(`Delete "${s.name}"?`)) deleteShape(s.name); }}>x</button>
                </span>
              ))}
            </div>
          )}
        </div>
      )}

      {activeTab === 'mode' && (
        <div className="panel" style={{ padding: 12, background: "var(--ink-2)", borderBottom: "1px solid var(--hair)" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, color: "var(--bone-dim)", letterSpacing: 1, textTransform: "uppercase" }}>Strand</span>
            {['thin', 'full', 'string'].map(mode => (
              <button key={mode} onClick={() => setStrandMode(mode)}
                style={{
                  padding: "10px 16px", fontSize: 13, letterSpacing: 1, cursor: "pointer",
                  fontFamily: "inherit", textTransform: "uppercase", border: "1px solid",
                  background: strandMode === mode ? "var(--accent)" : "transparent",
                  color: strandMode === mode ? "var(--ink)" : "var(--bone-dim)",
                  borderColor: strandMode === mode ? "var(--accent)" : "var(--hair)",
                  fontWeight: strandMode === mode ? 600 : 400,
                }}>
                {mode}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 12 }}>
            <span style={{ fontSize: 11, color: "var(--bone-dim)", letterSpacing: 1, textTransform: "uppercase" }}>Zoom</span>
            <button onClick={() => setZoom(z => Math.max(0.15, +(z / 1.3).toFixed(2)))}
              style={{ width: 36, height: 36, background: "var(--ink-2)", border: "1px solid var(--hair)", color: "var(--bone)", fontSize: 18, cursor: "pointer", fontFamily: "inherit" }}>-</button>
            <span style={{ fontSize: 13, color: "var(--bone)", minWidth: 44, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
            <button onClick={() => setZoom(z => Math.min(5, +(z * 1.3).toFixed(2)))}
              style={{ width: 36, height: 36, background: "var(--ink-2)", border: "1px solid var(--hair)", color: "var(--bone)", fontSize: 18, cursor: "pointer", fontFamily: "inherit" }}>+</button>
            <button onClick={() => { setZoom(1); setPanX(0); setPanY(0); }}
              style={{ padding: "8px 14px", background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", fontSize: 12, letterSpacing: 1, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>Reset</button>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 12 }}>
            <button onClick={() => setShowNails(v => !v)}
              style={{
                padding: "10px 16px", fontSize: 13, letterSpacing: 1, cursor: "pointer",
                fontFamily: "inherit", textTransform: "uppercase", border: "1px solid",
                background: showNails ? "var(--accent)" : "transparent",
                color: showNails ? "var(--ink)" : "var(--bone-dim)",
                borderColor: showNails ? "var(--accent)" : "var(--hair)",
              }}>
              Nails
            </button>
          </div>
          {stringStats.totalLen > 0 && (
            <div style={{ marginTop: 16, borderTop: "1px solid var(--hair)", paddingTop: 12 }}>
              <div style={{ fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: "var(--accent)", marginBottom: 8 }}>
                String lengths — total: {(stringStats.totalLen * 15 / 10).toFixed(0)}cm
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {Object.entries(stringStats.byColor)
                  .sort(([, a], [, b]) => b - a)
                  .map(([hex, len], rank) => {
                    const pct = ((len / stringStats.totalLen) * 100).toFixed(0);
                    const name = JOAO.find(j => j.hex === hex)?.name || hex;
                    return (
                      <div key={hex} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
                        <span style={{ width: 12, height: 12, background: hex, display: "inline-block", borderRadius: 2, flexShrink: 0 }} />
                        <span style={{ flex: 1, color: "var(--bone-dim)" }}>{name}</span>
                        <span style={{ color: "var(--bone-dim)" }}>{(len * 15 / 10).toFixed(0)}cm</span>
                        <span style={{ color: "var(--accent)", minWidth: 36, textAlign: "right" }}>{pct}%</span>
                      </div>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );

  // ========== RENDER ==========
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100dvh", overflow: "hidden" }}>
      {landscapeSplit ? (
        <div className="land-split">
          <div className="land-split-main" style={{ overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            {statsBarEl}
            {tabPanelsEl}
            {cycleStripEl}
          </div>
          <div className="land-split-knot">
            {knotViewportEl}
          </div>
        </div>
      ) : activeTab === 'edit' ? (
          <>
            {statsBarEl}
            <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, overflow: "hidden" }}>
              {tabPanelsEl}
            </div>
            <div style={{ height: "30dvh", flexShrink: 0, borderTop: "1px solid var(--hair)", overflow: "hidden" }}>
              {knotViewportEl}
            </div>
          </>
        ) : (
          <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
            {statsBarEl}
            {tabPanelsEl}
            {knotViewportEl}
            {cycleStripEl}
          </div>
        )}

      {/* TAB BAR — bottom */}
      <div className="tab-bar">
        <button className={`tab-btn ${activeTab === 'edit' ? 'active' : ''}`}
          onClick={() => setActiveTab(activeTab === 'edit' ? null : 'edit')}>Edit</button>
        <button className={`tab-btn ${activeTab === 'shapes' ? 'active' : ''}`}
          onClick={() => setActiveTab(activeTab === 'shapes' ? null : 'shapes')}>Shapes</button>
        <button className={`tab-btn ${activeTab === 'mode' ? 'active' : ''}`}
          onClick={() => setActiveTab(activeTab === 'mode' ? null : 'mode')}>Mode</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<KnotMakerMobile />);
</script>
</body>
</html>
