<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --ink: #0a0d10;

    --oxblood: #7a2828;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink); color: var(--bone); font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { background: var(--ink); }
  button, input { font-family: inherit; }
  .knm-label { font-size: 11px; letter-spacing: 1.6px; color: var(--bone-dim); text-transform: uppercase; }
  .knm-btn {

  .knm-btn.is-active::before {

    background: var(--accent); color: var(--ink); border: none;
    padding: 7px 14px; font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase;
    cursor: pointer; font-weight: 600;
  }
  .knm-btn-primary:hover { background: #e0bd7c; }
  .knm-divider { width: 1px; align-self: stretch; background: var(--hair); margin: 0 4px; }
  .knm-chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--hair); padding: 5px 10px; font-size: 12px;
    color: var(--bone-dim); cursor: pointer; letter-spacing: 0.5px;

  }
  .knm-chip:hover { color: var(--bone); border-color: var(--bone-faint); }
  .knm-chip-x {
    color: transparent; transition: color 120ms; font-size: 12px; line-height: 1;
    background: none; border: none; cursor: pointer; padding: 0;

  .knm-chip:hover .knm-chip-x { color: var(--oxblood); }
  .knm-chip-x:hover { color: #c84040 !important; }
  .knm-frame {

  }

  .knm-num:focus { outline: none; border-bottom-color: var(--accent); }
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// ========== SHAPE PRESETS ==========
function makePreset(name, curW, curH) {
  if (name === 'staircase-boot') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 4 ? 8 + y * 2 : gw;
      for (let x = 0; x < Math.min(w, gw); x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'L-shape') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 2 ? 8 : gw;
      for (let x = 0; x < w; x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'cross') {
    const gw = 15, gh = 15;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++)
      for (let x = 0; x < gw; x++)
        if ((x >= 5 && x < 10) || (y >= 5 && y < 10)) cells[y][x] = true;
    return { cells, gw, gh };
  }
  // rectangle — fills current grid size
  const gw = curW || 18, gh = curH || 10;
  return { cells: Array.from({length: gh}, () => Array(gw).fill(true)), gw, gh };
}

// ========== CELL-GRID SHAPE FUNCTIONS ==========
// These replace the original's W/H/nw/nh parameterized functions
// Coordinate space is [0, gw] × [0, gh], same as original's [0,W] × [0,H]

function buildEdges(cells, gw, gh) {
  // Build merged boundary edge segments — same format as original
  const hUnits = []; // {y, x} for unit h-edge at (x,y)→(x+1,y)
  const vUnits = []; // {x, y} for unit v-edge at (x,y)→(x,y+1)
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below) hUnits.push({y, x});
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right) vUnits.push({x, y});
    }
  // Merge consecutive horizontal edges at same y
  const edges = [];
  const hByY = {};
  for (const e of hUnits) { if (!hByY[e.y]) hByY[e.y] = []; hByY[e.y].push(e.x); }
  for (const y in hByY) {
    const xs = hByY[y].sort((a,b) => a-b);
    let start = xs[0];
    for (let i = 1; i <= xs.length; i++) {
      if (i < xs.length && xs[i] === xs[i-1] + 1) continue;
      edges.push({ y: +y, x0: start, x1: xs[i-1] + 1, type: 'h' });
      if (i < xs.length) start = xs[i];
    }
  }
  // Merge consecutive vertical edges at same x
  const vByX = {};
  for (const e of vUnits) { if (!vByX[e.x]) vByX[e.x] = []; vByX[e.x].push(e.y); }
  for (const x in vByX) {
    const ys = vByX[x].sort((a,b) => a-b);
    let start = ys[0];
    for (let i = 1; i <= ys.length; i++) {
      if (i < ys.length && ys[i] === ys[i-1] + 1) continue;
      edges.push({ x: +x, y0: start, y1: ys[i-1] + 1, type: 'v' });
      if (i < ys.length) start = ys[i];
    }
  }
  return edges;
}

function buildGaps(cells, gw, gh) {
  // Each unit boundary edge has a gap at its midpoint
  // Returns array of {x, y, isH, interiorDir}
  const gaps = [];
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below)
        gaps.push({ x: x + 0.5, y, isH: true, interiorBelow: !!below });
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right)
        gaps.push({ x, y: y + 0.5, isH: false, interiorRight: !!right });
    }
  return gaps;
}

function getInitialDir(gap) {
  // Same direction convention as original:
  // Top edge (interior below): dx=1, dy=1
  // Right edge (interior left): dx=-1, dy=1
  // Bottom edge (interior above): dx=-1, dy=-1
  // Left edge (interior right): dx=1, dy=-1
  if (gap.isH) {
    return gap.interiorBelow ? { dx: 1, dy: 1 } : { dx: -1, dy: -1 };
  }
  return gap.interiorRight ? { dx: 1, dy: -1 } : { dx: -1, dy: 1 };
}

function pointToGapIdx(px, py, gaps) {
  for (let i = 0; i < gaps.length; i++)
    if (Math.abs(px - gaps[i].x) < 0.1 && Math.abs(py - gaps[i].y) < 0.1) return i;
  return -1;
}

function isOnBoundary(px, py, cells, gw, gh) {
  const E = 0.01;
  const iy = Math.round(py), ix = Math.round(px);
  // Horizontal edge check (py near integer)
  if (Math.abs(py - iy) < E) {
    const cx = Math.floor(px);
    if (cx >= 0 && cx < gw) {
      const above = iy > 0 ? !!cells[iy-1]?.[cx] : false;
      const below = iy < gh ? !!cells[iy]?.[cx] : false;
      if (above !== below) return true;
    }
  }
  // Vertical edge check (px near integer)
  if (Math.abs(px - ix) < E) {
    const cy = Math.floor(py);
    if (cy >= 0 && cy < gh) {
      const left = ix > 0 ? !!cells[cy]?.[ix-1] : false;
      const right = ix < gw ? !!cells[cy]?.[ix] : false;
      if (left !== right) return true;
    }
  }
  return false;
}

// ========== BILLIARD TRACING — identical to original ==========
function tracePath(startIdx, gaps, edges, cells, gw, gh) {
  const EPS = 1e-9;
  const sc = gaps[startIdx];
  const pts = [{ x: sc.x, y: sc.y }];
  let { dx, dy } = getInitialDir(sc);
  let x = sc.x, y = sc.y;
  const maxIter = edges.length * 200 + 2000;
  for (let iter = 0; iter < maxIter; iter++) {
    let minT = Infinity, hitH = false, hitV = false;
    for (const edge of edges) {
      let t;
      if (edge.type === 'h') {
        if (Math.abs(dy) < EPS) continue;
        t = (edge.y - y) / dy;
        if (t < EPS) continue;
        const hx = x + dx * t;
        if (hx < edge.x0 - EPS || hx > edge.x1 + EPS) continue;
      } else {
        if (Math.abs(dx) < EPS) continue;
        t = (edge.x - x) / dx;
        if (t < EPS) continue;
        const hy = y + dy * t;
        if (hy < edge.y0 - EPS || hy > edge.y1 + EPS) continue;
      }
      if (t < minT - EPS) { minT = t; hitH = edge.type === 'h'; hitV = edge.type === 'v'; }
      else if (Math.abs(t - minT) < EPS * 100) {
        if (edge.type === 'h') hitH = true;
        if (edge.type === 'v') hitV = true;
      }
    }
    if (minT === Infinity || minT > 1e6) break;
    x += dx * minT; y += dy * minT;
    x = Math.round(x * 1e6) / 1e6; y = Math.round(y * 1e6) / 1e6;
    pts.push({ x, y });
    if (pts.length > 2 && Math.abs(x - sc.x) < 0.01 && Math.abs(y - sc.y) < 0.01) break;
    if (hitH && hitV) { dx = -dx; dy = -dy; }
    else if (hitH) dy = -dy;
    else if (hitV) dx = -dx;
  }
  return pts;
}

function getAllCycles(cells, gw, gh) {
  const edges = buildEdges(cells, gw, gh);
  const gaps = buildGaps(cells, gw, gh);
  if (gaps.length === 0) return { cycles: [], gaps, edges };
  const vis = new Set(), cycles = [];
  for (let g = 0; g < gaps.length; g++) {
    if (vis.has(g)) continue;
    const pts = tracePath(g, gaps, edges, cells, gw, gh);
    const gapSet = new Set();
    for (const p of pts) {
      const gi = pointToGapIdx(p.x, p.y, gaps);
      if (gi >= 0) { gapSet.add(gi); vis.add(gi); }
    }
    cycles.push({ startGap: g, points: pts, gaps: gapSet });
  }
  return { cycles, gaps, edges };
}

// ========== COLORS & UTILS — identical to original ==========
const COLORS = [
  "#2E7D7D", "#B5541C", "#3D5A80", "#D4A017",
  "#8B2E52", "#6B8E6B", "#5B8DB8", "#C25476",
  "#C8804A", "#4A7C5E", "#A67C3C", "#5BA8A0",
];

function subtractInterval(a0, a1, b0, b1) {
  if (b0 >= a1 || b1 <= a0) return [[a0, a1]];
  const r = [];
  if (a0 < b0) r.push([a0, b0]);
  if (b1 < a1) r.push([b1, a1]);
  return r;
}

// ========== MAIN COMPONENT ==========
function CelticKnotCustom() {
  const [cells, setCells] = useState(() => Array.from({ length: 10 }, () => Array(18).fill(true)));
  const [gridW, setGridW] = useState(18);
  const [gridH, setGridH] = useState(10);
  const [savedShapes, setSavedShapes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('celtic.savedShapes') || '[]'); }
    catch { return []; }
  });
  const persistShapes = useCallback((next) => {
    setSavedShapes(next);
    try { localStorage.setItem('celtic.savedShapes', JSON.stringify(next)); } catch {}
  }, []);
  const [selGap, setSelGap] = useState(null);
  const [showAll, setShowAll] = useState(true);
  const [hoverGap, setHoverGap] = useState(null);
  const [showGrid, setShowGrid] = useState(true);
  const [zoom, setZoom] = useState(1);
  const knotWrapRef = useRef(null);
  useEffect(() => {
    const el = knotWrapRef.current;
    if (!el) return;
    const onWheel = (e) => {
      e.preventDefault();
      setZoom(z => Math.max(0.3, Math.min(4, +(z * (e.deltaY < 0 ? 1.025 : 1 / 1.025)).toFixed(3))));
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, []);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('celtic.lang') || 'en'; } catch { return 'en'; }
  });
  const setLangPersist = useCallback((l) => {
    setLang(l);
    try { localStorage.setItem('celtic.lang', l); } catch {}
  }, []);
  const T = useMemo(() => {
    const dict = {
      en: {
        shapes: "Shapes", mode: "Mode", cycles: "Cycles",
        save: "Save", export: "Export", import: "Import",
        edit: "Edit", thin: "thin", full: "full", string: "string", reset: "reset",
        cycle: "cycle", cyclesPlural: "cycles",
        fill: "Fill", clear: "Clear",
        dragHint: "Drag a rectangle to fill or clear",
        namePrompt: "Name this shape:",
        deleteConfirm: (n) => `Delete "${n}"?`,
        importError: (m) => `Could not import: ${m}`,
      },
      pt: {
        shapes: "Formas", mode: "Modo", cycles: "Ciclos",
        save: "Guardar", export: "Exportar", import: "Importar",
        edit: "Editar", thin: "fino", full: "cheio", string: "fio", reset: "repor",
        cycle: "ciclo", cyclesPlural: "ciclos",
        fill: "Preencher", clear: "Limpar",
        dragHint: "Arraste um rectângulo para preencher ou limpar",
        namePrompt: "Nome desta forma:",
        deleteConfirm: (n) => `Apagar "${n}"?`,
        importError: (m) => `Não foi possível importar: ${m}`,
      },
    };
    return dict[lang] || dict.en;
  }, [lang]);
  const [cycleColors, setCycleColors] = useState({});
  const [visibleCycles, setVisibleCycles] = useState({});
  const [animate, setAnimate] = useState(true);
  const [strandMode, setStrandMode] = useState('thin'); // 'thin', 'full', 'string'
  const [animProgress, setAnimProgress] = useState({});
  const [editMode, setEditMode] = useState(false);
  const [painting, setPainting] = useState(null);
  const [marquee, setMarquee] = useState(null);
  const [wDraft, setWDraft] = useState(() => String(18));
  const [hDraft, setHDraft] = useState(() => String(10));
  const wDimFocusRef = useRef(false);
  const hDimFocusRef = useRef(false);
  const colorInputRefs = useRef({});
  const longPressTimerRef = useRef(null);
  const longPressFiredRef = useRef(false);
  const pressStartRef = useRef(null);

  useEffect(() => {
    if (!wDimFocusRef.current) setWDraft(String(gridW));
  }, [gridW]);
  useEffect(() => {
    if (!hDimFocusRef.current) setHDraft(String(gridH));
  }, [gridH]);

  // W and H for the rendering code — same role as original
  const W = gridW, H = gridH;

  const loadShape = useCallback((shape) => {
    setCells(shape.cells.map(r => [...r]));
    setGridW(shape.gw); setGridH(shape.gh);
    setSelGap(null); setShowAll(true); setCycleColors({}); setVisibleCycles({}); setAnimProgress({});
  }, []);
  const saveCurrentShape = useCallback(() => {
    const name = (typeof window !== "undefined" && window.prompt) ? window.prompt(T.namePrompt) : null;
    if (!name) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    const snap = { name: trimmed, gw: gridW, gh: gridH, cells: cells.map(r => [...r]) };
    const next = [...savedShapes.filter(s => s.name !== trimmed), snap];
    persistShapes(next);
  }, [cells, gridW, gridH, savedShapes, persistShapes, T]);
  const deleteShape = useCallback((name) => {
    persistShapes(savedShapes.filter(s => s.name !== name));
  }, [savedShapes, persistShapes]);

  const exportShapes = useCallback(() => {
    const blob = new Blob([JSON.stringify(savedShapes, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `celtic-shapes-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }, [savedShapes]);

  const importFileRef = useRef(null);
  const onImportFile = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("not an array");
        const valid = data.filter(s => s && typeof s.name === "string" && Array.isArray(s.cells) && Number.isInteger(s.gw) && Number.isInteger(s.gh));
        const merged = [...savedShapes];
        for (const s of valid) {
          const i = merged.findIndex(m => m.name === s.name);
          if (i >= 0) merged[i] = s; else merged.push(s);
        }
        persistShapes(merged);
      } catch (err) {
        window.alert(T.importError(err.message));
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }, [savedShapes, persistShapes, T]);

  const toggleCell = useCallback((x, y, forceVal) => {
    setCells(prev => {
      const next = prev.map(r => [...r]);
      next[y][x] = forceVal !== undefined ? forceVal : !prev[y][x];
      return next;
    });
    setSelGap(null); setShowAll(true); setAnimProgress({});
  }, []);

  const resizeGrid = useCallback((newW, newH) => {
    setCells(prev => Array.from({length: newH}, (_, y) =>
      Array.from({length: newW}, (_, x) => (y < prev.length && x < (prev[0]?.length || 0)) ? prev[y][x] : false)
    ));
    setGridW(newW); setGridH(newH);
    setSelGap(null); setShowAll(true); setAnimProgress({});
  }, []);

  const commitGridW = useCallback(() => {
    wDimFocusRef.current = false;
    let v = parseInt(wDraft, 10);
    if (Number.isNaN(v)) v = gridW;
    v = Math.min(100, Math.max(3, v));
    if (v !== gridW) resizeGrid(v, gridH);
    setWDraft(String(v));
  }, [wDraft, gridW, gridH, resizeGrid]);

  const commitGridH = useCallback(() => {
    hDimFocusRef.current = false;
    let v = parseInt(hDraft, 10);
    if (Number.isNaN(v)) v = gridH;
    v = Math.min(100, Math.max(3, v));
    if (v !== gridH) resizeGrid(gridW, v);
    setHDraft(String(v));
  }, [hDraft, gridH, gridW, resizeGrid]);

  const { cycles, gaps, edges } = useMemo(() => getAllCycles(cells, gridW, gridH), [cells, gridW, gridH]);
  const active = useMemo(() => selGap !== null ? cycles.find(c => c.gaps.has(selGap)) : null, [selGap, cycles]);

  const svgW = 800, svgH = 560, pad = 56;
  const cellSz = Math.min((svgW - 2 * pad) / W, (svgH - 2 * pad) / H) * 0.74 * zoom;
  const ox = (svgW - W * cellSz) / 2, oy = (svgH - H * cellSz) / 2;

  const toX = useCallback(x => ox + x * cellSz, [ox, cellSz]);
  const toY = useCallback(y => oy + y * cellSz, [oy, cellSz]);

  // Orthogonal grids: integer lattice (cell corners / boundaries) + half-integer (cell centers).
  const NAIL_GRID_PAD = 4;
  const nailGrid = useMemo(() => {
    let minC = W, minR = H, maxC = -1, maxR = -1;
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++)
        if (cells[y][x]) {
          minC = Math.min(minC, x); maxC = Math.max(maxC, x);
          minR = Math.min(minR, y); maxR = Math.max(maxR, y);
        }
    let x0, x1, y0, y1;
    if (maxC < 0) {
      x0 = -NAIL_GRID_PAD; x1 = W + NAIL_GRID_PAD;
      y0 = -NAIL_GRID_PAD; y1 = H + NAIL_GRID_PAD;
    } else {
      x0 = minC - NAIL_GRID_PAD;
      x1 = maxC + 1 + NAIL_GRID_PAD;
      y0 = minR - NAIL_GRID_PAD;
      y1 = maxR + 1 + NAIL_GRID_PAD;
    }
    const vInt = [];
    for (let gx = x0; gx <= x1; gx++)
      vInt.push({ x1: toX(gx), y1: toY(y0), x2: toX(gx), y2: toY(y1) });
    const hInt = [];
    for (let gy = y0; gy <= y1; gy++)
      hInt.push({ x1: toX(x0), y1: toY(gy), x2: toX(x1), y2: toY(gy) });
    const o = 0.5;
    const vHalf = [];
    for (let gx = x0; gx <= x1; gx++)
      vHalf.push({ x1: toX(gx + o), y1: toY(y0 + o), x2: toX(gx + o), y2: toY(y1 + o) });
    const hHalf = [];
    for (let gy = y0; gy <= y1; gy++)
      hHalf.push({ x1: toX(x0 + o), y1: toY(gy + o), x2: toX(x1 + o), y2: toY(gy + o) });
    return { vInt, hInt, vHalf, hHalf };
  }, [cells, W, H, toX, toY]);

  const gapDots = useMemo(() => gaps.map((g, i) => ({ i, x: toX(g.x), y: toY(g.y) })), [gaps, toX, toY]);

  const gr = Math.max(5, cellSz * 0.13);
  const sw = cellSz * (strandMode === 'full' ? 0.707 : strandMode === 'string' ? 0.12 : 0.45);
  const bgColor = "#0c0f12";

  // ===== WEAVE GRID LINES — same logic as original, cell-based clipping =====
  const weaveLines = useMemo(() => {
    const lines = [];
    // Backslash family: y = x + kVal, kVal = k + 0.5
    for (let k = -W; k <= H; k++) {
      const kVal = k + 0.5;
      // Find active x-segments: line is interior in column n if both cells (n, n+k) and (n, n+k+1) are active
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, -k), nMax = Math.min(W - 1, H - k - 2);
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = n + k, cy2 = n + k + 1;
        if (cy1 >= 0 && cy2 < H && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);

      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(x0 + kVal);
        const sx1 = toX(x1), sy1 = toY(x1 + kVal);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        // Cuts — identical to original
        const cuts = [];
        for (let m = -1; m <= W + H; m++) {
          const mVal = m + 0.5;
          const ix = (mVal - kVal) / 2;
          const iy = (mVal + kVal) / 2;
          // Same bounds as celtic-knot-3 (not isInteriorCrossing): corners where only 2 cells meet still need weave cuts.
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((k + m + W) % 2 === 1) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    // Forward-slash family: y = -x + mVal, mVal = m + 0.5
    for (let m = 0; m <= W + H - 1; m++) {
      const mVal = m + 0.5;
      // Find active x-segments: in column n, cells (n, m-n-1) and (n, m-n) must be active
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, Math.ceil(mVal - H)), nMax = Math.min(W - 1, Math.floor(mVal - 1));
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = m - n - 1, cy2 = m - n;
        if (cy1 >= 0 && cy2 < H && cy1 < H && cy2 >= 0 && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);

      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(mVal - x0);
        const sx1 = toX(x1), sy1 = toY(mVal - x1);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        const cuts = [];
        for (let k = -W; k <= H; k++) {
          const kVal2 = k + 0.5;
          const ix = (mVal - kVal2) / 2;
          const iy = (mVal + kVal2) / 2;
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((k + m + W) % 2 === 0) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    return lines;
  }, [cells, W, H, cellSz, toX, toY]);

  // ===== LOOM BACKGROUND — broken diagonals across the whole svg viewport, parity-cut for over/under =====
  const loomBackground = useMemo(() => {
    const segs = [];
    const gxLo = -ox / cellSz - 1, gxHi = (svgW - ox) / cellSz + 1;
    const gyLo = -oy / cellSz - 1, gyHi = (svgH - oy) / cellSz + 1;
    const gapG = (cellSz * 0.18 / cellSz) / Math.SQRT2;
    // Backslash family: y - x = k + 0.5
    const kMin = Math.floor(gyLo - gxHi) - 1;
    const kMax = Math.ceil(gyHi - gxLo) + 1;
    for (let k = kMin; k <= kMax; k++) {
      const kVal = k + 0.5;
      const x0 = Math.max(gxLo, gyLo - kVal);
      const x1 = Math.min(gxHi, gyHi - kVal);
      if (x1 <= x0) continue;
      const cuts = [];
      const mLo = Math.ceil(2 * x0 + kVal - 0.5);
      const mHi = Math.floor(2 * x1 + kVal - 0.5);
      for (let m = mLo; m <= mHi; m++) {
        if ((((k + m) % 2) + 2) % 2 === 1) cuts.push(((m + 0.5) - kVal) / 2);
      }
      cuts.sort((a, b) => a - b);
      let cur = x0;
      for (const c of cuts) {
        const e = c - gapG;
        if (e > cur) segs.push({ x1: toX(cur), y1: toY(cur + kVal), x2: toX(e), y2: toY(e + kVal) });
        cur = c + gapG;
      }
      if (x1 > cur) segs.push({ x1: toX(cur), y1: toY(cur + kVal), x2: toX(x1), y2: toY(x1 + kVal) });
    }
    // Forward-slash family: y + x = m + 0.5
    const mMin = Math.floor(gyLo + gxLo) - 1;
    const mMax = Math.ceil(gyHi + gxHi) + 1;
    for (let m = mMin; m <= mMax; m++) {
      const mVal = m + 0.5;
      const x0 = Math.max(gxLo, mVal - gyHi);
      const x1 = Math.min(gxHi, mVal - gyLo);
      if (x1 <= x0) continue;
      const cuts = [];
      const kLo = Math.ceil(mVal - 2 * x1 - 0.5);
      const kHi = Math.floor(mVal - 2 * x0 - 0.5);
      for (let k = kLo; k <= kHi; k++) {
        if ((((k + m) % 2) + 2) % 2 === 0) cuts.push((mVal - (k + 0.5)) / 2);
      }
      cuts.sort((a, b) => a - b);
      let cur = x0;
      for (const c of cuts) {
        const e = c - gapG;
        if (e > cur) segs.push({ x1: toX(cur), y1: toY(mVal - cur), x2: toX(e), y2: toY(mVal - e) });
        cur = c + gapG;
      }
      if (x1 > cur) segs.push({ x1: toX(cur), y1: toY(mVal - cur), x2: toX(x1), y2: toY(mVal - x1) });
    }
    return segs;
  }, [ox, oy, cellSz, svgW, svgH, toX, toY]);

  // ===== STRAND RENDERING — same loom rule as celtic-knot-3 (parity cuts only; no crossing-map gate) =====
  // Returns two sets: one for backslash segments, one for forward-slash segments
  // Each records crossing points that the segment passes through
  function getCoveredCrossings(pts) {
    const bsSet = new Set(); // crossings on backslash segments
    const fsSet = new Set(); // crossings on forward-slash segments
    for (let seg = 0; seg < pts.length - 1; seg++) {
      const p1 = pts[seg], p2 = pts[seg + 1];
      const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
      if (sdx === 0 || sdy === 0) continue;
      const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
      const isBS = (sdx === sdy);
      if (isBS) {
        const kVal = p1.y - p1.x;
        for (let mi = -1; mi <= W + H; mi++) {
          const mVal = mi + 0.5;
          const cx = (mVal - kVal) / 2, cy = (mVal + kVal) / 2;
          if (cx > minX + 0.01 && cx < maxX - 0.01 && cy > 0.01 && cy < H - 0.01)
            bsSet.add(`${cx.toFixed(2)},${cy.toFixed(2)}`);
        }
      } else {
        const mVal = p1.y + p1.x;
        for (let ki = -W; ki <= H; ki++) {
          const kVal2 = ki + 0.5;
          const cx = (mVal - kVal2) / 2, cy = (mVal + kVal2) / 2;
          if (cx > minX + 0.01 && cx < maxX - 0.01 && cy > 0.01 && cy < H - 0.01)
            fsSet.add(`${cx.toFixed(2)},${cy.toFixed(2)}`);
        }
      }
    }
    return { bsSet, fsSet };
  }

  function renderStrandSVG(pts, color, crossingMap) {
    const elements = [];
    const lineW = sw;
    const gap = strandMode === 'string' ? cellSz * 0.16 : sw / 2;
    for (let seg = 0; seg < pts.length - 1; seg++) {
      const p1 = pts[seg], p2 = pts[seg + 1];
      const sx1 = toX(p1.x), sy1 = toY(p1.y);
      const sx2 = toX(p2.x), sy2 = toY(p2.y);
      const ddx = sx2 - sx1, ddy = sy2 - sy1;
      const len = Math.hypot(ddx, ddy);
      if (len < 0.5) continue;
      const ux = ddx / len, uy = ddy / len;
      const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
      const p1Edge = isOnBoundary(p1.x, p1.y, cells, W, H);
      const p2Edge = isOnBoundary(p2.x, p2.y, cells, W, H);
      // Skip short segment between two corner gaps — the arc replaces it
      const p1gi = pointToGapIdx(p1.x, p1.y, gaps);
      const p2gi = pointToGapIdx(p2.x, p2.y, gaps);
      const segLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (p1gi >= 0 && cornerGapSet.has(p1gi) && p2gi >= 0 && cornerGapSet.has(p2gi) && segLen < 1.1) continue;
      if (sdx === 0 || sdy === 0) {
        elements.push({ type: 'strand', x1: sx1, y1: sy1, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: p1Edge, edgeEnd: p2Edge });
        continue;
      }
      const isBS = (sdx === sdy);
      const cuts = [];
      const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
      // *** KEY: use k/m family iteration, identical to original ***
      if (isBS) {
        const kVal = p1.y - p1.x;
        const ki = Math.round(kVal - 0.5);
        for (let mi = -1; mi <= W + H; mi++) {
          const mVal = mi + 0.5;
          const ix = (mVal - kVal) / 2, iy = (mVal + kVal) / 2;
          if (ix > minX + 0.01 && ix < maxX - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((ki + mi + W) % 2 === 1) {
              if (!crossingMap || crossingMap.forBS.has(`${ix.toFixed(2)},${iy.toFixed(2)}`))
                cuts.push({ sx: toX(ix), sy: toY(iy) });
            }
          }
        }
      } else {
        const mVal = p1.y + p1.x;
        const mi = Math.round(mVal - 0.5);
        for (let ki = -W; ki <= H; ki++) {
          const kVal2 = ki + 0.5;
          const ix = (mVal - kVal2) / 2, iy = (mVal + kVal2) / 2;
          if (ix > minX + 0.01 && ix < maxX - 0.01 && iy > 0.01 && iy < H - 0.01) {
            if ((ki + mi + W) % 2 === 0) {
              if (!crossingMap || crossingMap.forFS.has(`${ix.toFixed(2)},${iy.toFixed(2)}`))
                cuts.push({ sx: toX(ix), sy: toY(iy) });
            }
          }
        }
      }
      cuts.sort((a, b) => (a.sx - sx1) * ux + (a.sy - sy1) * uy - ((b.sx - sx1) * ux + (b.sy - sy1) * uy));
      let cx = sx1, cy = sy1;
      let isFirst = true;
      for (const cut of cuts) {
        const gsx = cut.sx - ux * gap, gsy = cut.sy - uy * gap;
        const proj = (gsx - cx) * ux + (gsy - cy) * uy;
        if (proj > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: gsx, y2: gsy, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: false });
        cx = cut.sx + ux * gap; cy = cut.sy + uy * gap;
        isFirst = false;
      }
      const projEnd = (sx2 - cx) * ux + (sy2 - cy) * uy;
      if (projEnd > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: p2Edge });
    }
    return elements;
  }

  // ===== All remaining logic identical to original =====
  const getCycleColor = useCallback((i) => {
    if (strandMode === 'string') return "#c8a96e";
    return cycleColors[i] || COLORS[i % COLORS.length];
  }, [cycleColors, strandMode]);
  const setCycleColor = useCallback((i, color) => setCycleColors(prev => ({ ...prev, [i]: color })), []);

  const isCycleVisible = useCallback((i) => {
    if (showAll) return visibleCycles[i] !== false;
    return visibleCycles[i] === true;
  }, [showAll, visibleCycles]);

  const animStartTime = useRef({});
  const toggleCycle = useCallback((i) => {
    const willBeVisible = !isCycleVisible(i);
    setVisibleCycles(prev => ({ ...prev, [i]: willBeVisible }));
    if (willBeVisible && animate) {
      animStartTime.current[i] = performance.now();
      setAnimProgress(prev => ({ ...prev, [i]: 0 }));
    } else if (willBeVisible) {
      setAnimProgress(prev => ({ ...prev, [i]: Infinity }));
    }
  }, [isCycleVisible, animate]);

  useEffect(() => {
    if (!animate) return;
    let animating = false;
    cycles.forEach((c, i) => {
      if (isCycleVisible(i) && (animProgress[i] ?? Infinity) < c.points.length - 1) {
        animating = true;
        if (animStartTime.current[i] == null) animStartTime.current[i] = performance.now();
      }
    });
    if (!animating) return;
    const id = requestAnimationFrame((now) => {
      setAnimProgress(prev => {
        const next = { ...prev };
        cycles.forEach((c, i) => {
          const total = c.points.length - 1;
          if (isCycleVisible(i) && (prev[i] ?? Infinity) < total) {
            const elapsed = (now - (animStartTime.current[i] ?? now)) / 1000;
            const duration = Math.max(2.5, total * 0.06);
            const frac = Math.min(elapsed / duration, 1);
            next[i] = frac * total;
            if (frac >= 1) { next[i] = total; delete animStartTime.current[i]; }
          }
        });
        return next;
      });
    });
    return () => cancelAnimationFrame(id);
  }, [animate, animProgress, cycles, isCycleVisible]);

  const getVisiblePoints = useCallback((cycleIdx) => {
    if (!cycles[cycleIdx]) return [];
    const pts = cycles[cycleIdx].points;
    if (!pts || pts.length < 2) return pts || [];
    const prog = animProgress[cycleIdx];
    if (prog == null || prog >= pts.length - 1) return pts;
    const segIdx = Math.floor(prog);
    const segFrac = prog - segIdx;
    const visible = pts.slice(0, segIdx + 1);
    if (segIdx < pts.length - 1) {
      const p1 = pts[segIdx], p2 = pts[segIdx + 1];
      const frac = Math.max(0.001, segFrac);
      visible.push({ x: p1.x + (p2.x - p1.x) * frac, y: p1.y + (p2.y - p1.y) * frac });
    }
    return visible;
  }, [cycles, animProgress]);

  // ===== CORNER DETECTION — which gaps are at convex corners =====
  const cornerGapSet = useMemo(() => {
    const set = new Set();
    for (let vy = 0; vy <= H; vy++)
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br !== 1) continue;
        let g1, g2;
        if (br) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; }
        else if (bl) { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; }
        else if (tr) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; }
        else { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; }
        const gi1 = pointToGapIdx(g1.x, g1.y, gaps);
        const gi2 = pointToGapIdx(g2.x, g2.y, gaps);
        if (gi1 >= 0) set.add(gi1);
        if (gi2 >= 0) set.add(gi2);
      }
    return set;
  }, [cells, W, H, gaps]);

  // ===== NAIL POSITIONS =====
  const nailPositions = useMemo(() => {
    const nails = [];
    // Edge nails: gap midpoints, excluding those adjacent to corners
    for (let i = 0; i < gaps.length; i++) {
      if (!cornerGapSet.has(i))
        nails.push({ x: gaps[i].x, y: gaps[i].y, type: 'edge' });
    }
    // Corner nails: convex corners (exactly 1 filled cell)
    for (let vy = 0; vy <= H; vy++)
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br === 1)
          nails.push({ x: vx, y: vy, type: 'corner' });
      }
    return nails;
  }, [cells, W, H, gaps]);

  // ===== CORNER ARCS — cosmetic semicircles around corner nails =====
  const cornerArcs = useMemo(() => {
    const arcs = [];
    for (let vy = 0; vy <= H; vy++) {
      for (let vx = 0; vx <= W; vx++) {
        const tl = (vy > 0 && vx > 0 && cells[vy-1][vx-1]) ? 1 : 0;
        const tr = (vy > 0 && vx < W && cells[vy-1][vx]) ? 1 : 0;
        const bl = (vy < H && vx > 0 && cells[vy][vx-1]) ? 1 : 0;
        const br = (vy < H && vx < W && cells[vy][vx]) ? 1 : 0;
        if (tl + tr + bl + br !== 1) continue;
        // sweep flipped so arc bulges AWAY from interior (concave toward shape)
        let g1, g2, sweep;
        if (br) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; sweep = 0; }
        else if (bl) { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy+0.5}; sweep = 1; }
        else if (tr) { g1 = {x:vx+0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; sweep = 1; }
        else { g1 = {x:vx-0.5,y:vy}; g2 = {x:vx,y:vy-0.5}; sweep = 0; }
        const gi1 = pointToGapIdx(g1.x, g1.y, gaps);
        const gi2 = pointToGapIdx(g2.x, g2.y, gaps);
        const ci1 = gi1 >= 0 ? cycles.findIndex(c => c.gaps.has(gi1)) : -1;
        const ci2 = gi2 >= 0 ? cycles.findIndex(c => c.gaps.has(gi2)) : -1;
        let color = null;
        if (ci1 >= 0 && isCycleVisible(ci1)) color = getCycleColor(ci1);
        else if (ci2 >= 0 && isCycleVisible(ci2)) color = getCycleColor(ci2);
        if (!color) continue;
        // semicircle: radius = half the chord length between the two gap points
        const dx = toX(g2.x) - toX(g1.x), dy = toY(g2.y) - toY(g1.y);
        const r = Math.hypot(dx, dy) / 2;
        arcs.push({ sx1: toX(g1.x), sy1: toY(g1.y), sx2: toX(g2.x), sy2: toY(g2.y), r, sweep, color });
      }
    }
    return arcs;
  }, [cells, W, H, gaps, cycles, isCycleVisible, getCycleColor, cellSz, toX, toY]);

  const renderElements = useMemo(() => {
    try {
      // Build per-cycle crossing coverage for animation-aware gaps
      const cyclePts = [];
      const cycleCrossings = [];
      for (let i = 0; i < cycles.length; i++) {
        const pts = isCycleVisible(i) ? getVisiblePoints(i) : [];
        cyclePts.push(pts);
        cycleCrossings.push(pts.length >= 2 ? getCoveredCrossings(pts) : { bsSet: new Set(), fsSet: new Set() });
      }
      // Merge: a backslash segment gets gaps only where a forward-slash is present, and vice versa
      const allBS = new Set(), allFS = new Set();
      for (let j = 0; j < cycles.length; j++) {
        for (const k of cycleCrossings[j].bsSet) allBS.add(k);
        for (const k of cycleCrossings[j].fsSet) allFS.add(k);
      }
      // For a BS segment, the crossing strand is FS, so check allFS; vice versa
      // Pack into { forBS: allFS, forFS: allBS }
      const crossingMap = { forBS: allFS, forFS: allBS };
      const els = [];
      for (let i = 0; i < cycles.length; i++) {
        if (!isCycleVisible(i)) continue;
        const pts = cyclePts[i];
        if (pts && pts.length >= 2) els.push(...renderStrandSVG(pts, getCycleColor(i), crossingMap));
      }
      els.sort((a, b) => a.z - b.z);
      return els;
    } catch(e) { console.error('RENDER ERROR:', e); return []; }
  }, [cycles, isCycleVisible, cells, W, H, cellSz, toX, toY, sw, cycleColors, animProgress, getVisiblePoints]);

  const clickGap = useCallback(g => {
    const ci = cycles.findIndex(c => c.gaps.has(g));
    if (ci < 0) return;
    setSelGap(g);
    if (showAll) setShowAll(false);
    setVisibleCycles(prev => ({ ...prev, [ci]: true }));
    if (animate) {
      animStartTime.current[ci] = performance.now();
      setAnimProgress(prev => ({ ...prev, [ci]: 0 }));
    } else {
      setAnimProgress(prev => ({ ...prev, [ci]: Infinity }));
    }
  }, [cycles, animate, showAll]);

  // Boundary path — draw each boundary edge
  const boundaryEdges = useMemo(() => {
    return edges.map(e => {
      if (e.type === 'h') return { x1: toX(e.x0), y1: toY(e.y), x2: toX(e.x1), y2: toY(e.y) };
      return { x1: toX(e.x), y1: toY(e.y0), x2: toX(e.x), y2: toY(e.y1) };
    });
  }, [edges, toX, toY]);

  const editorCellSize = Math.min(28, Math.max(14, 420 / Math.max(gridW, gridH)));
  const editorRef = useRef(null);
  const cellsRef = useRef(cells);
  cellsRef.current = cells;

  // Edge-run labels: for each maximal straight perimeter run, count cells along it.
  const edgeRuns = useMemo(() => {
    const isOn = (x, y) => x >= 0 && y >= 0 && x < gridW && y < gridH && !!cells[y]?.[x];
    const runs = [];
    // Horizontal edges (between row y-1 and row y)
    for (let y = 0; y <= gridH; y++) {
      let s = null, filledAbove = false;
      for (let x = 0; x <= gridW; x++) {
        const a = isOn(x, y - 1), b = isOn(x, y);
        const isEdge = x < gridW && (a !== b);
        if (isEdge) {
          if (s === null) { s = x; filledAbove = a; }
        } else if (s !== null) {
          runs.push({ orient: "h", y, x0: s, x1: x, len: x - s, filledAbove });
          s = null;
        }
      }
    }
    // Vertical edges (between col x-1 and col x)
    for (let x = 0; x <= gridW; x++) {
      let s = null, filledLeft = false;
      for (let y = 0; y <= gridH; y++) {
        const a = isOn(x - 1, y), b = isOn(x, y);
        const isEdge = y < gridH && (a !== b);
        if (isEdge) {
          if (s === null) { s = y; filledLeft = a; }
        } else if (s !== null) {
          runs.push({ orient: "v", x, y0: s, y1: y, len: y - s, filledLeft });
          s = null;
        }
      }
    }
    return runs;
  }, [cells, gridW, gridH]);

  const getCellFromPointer = useCallback((e) => {
    const rect = editorRef.current?.getBoundingClientRect();
    if (!rect) return null;
    const px = (e.clientX ?? e.touches?.[0]?.clientX) - rect.left - 2;
    const py = (e.clientY ?? e.touches?.[0]?.clientY) - rect.top - 14;
    const x = Math.floor(px / editorCellSize);
    const y = Math.floor(py / editorCellSize);
    if (x >= 0 && x < gridW && y >= 0 && y < gridH) return { x, y };
    return null;
  }, [editorCellSize, gridW, gridH]);

  const onEditorPointerDown = useCallback((e) => {
    e.preventDefault();
    editorRef.current?.setPointerCapture?.(e.pointerId);
    const c = getCellFromPointer(e);
    if (!c) return;
    const val = !cellsRef.current[c.y][c.x];
    setMarquee({ x0: c.x, y0: c.y, x1: c.x, y1: c.y, val });
  }, [getCellFromPointer]);

  const onEditorPointerMove = useCallback((e) => {
    if (!marquee) return;
    const rect = editorRef.current?.getBoundingClientRect();
    if (!rect) return;
    const px = (e.clientX ?? e.touches?.[0]?.clientX) - rect.left - 2;
    const py = (e.clientY ?? e.touches?.[0]?.clientY) - rect.top - 14;
    const x = Math.max(0, Math.min(gridW - 1, Math.floor(px / editorCellSize)));
    const y = Math.max(0, Math.min(gridH - 1, Math.floor(py / editorCellSize)));
    if (x === marquee.x1 && y === marquee.y1) return;
    setMarquee({ ...marquee, x1: x, y1: y });
  }, [marquee, editorCellSize, gridW, gridH]);

  const onEditorPointerUp = useCallback(() => {
    if (!marquee) return;
    const { x0, y0, x1, y1, val } = marquee;
    const xa = Math.min(x0, x1), xb = Math.max(x0, x1);
    const ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    setCells(prev => prev.map((row, y) =>
      row.map((c, x) => (x >= xa && x <= xb && y >= ya && y <= yb) ? val : c)
    ));
    setSelGap(null); setShowAll(true); setAnimProgress({});
    setMarquee(null);
  }, [marquee]);

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", padding: "32px 24px 60px" }}>
      {/* HEADER */}
      <header style={{ width: "100%", maxWidth: 920, marginBottom: 24, display: "flex", alignItems: "baseline", justifyContent: "space-between", borderBottom: "1px solid var(--hair)", paddingBottom: 16, gap: 16 }}>
        <div style={{ fontSize: 16, letterSpacing: 2, color: "var(--bone)", textTransform: "uppercase" }}>
          <span style={{ color: "var(--bone-dim)" }}>string_billiards/</span>knot_maker
        </div>
        <button
          onClick={() => setLangPersist(lang === "en" ? "pt" : "en")}
          title="Language"
          style={{ background: "transparent", border: "1px solid var(--hair)", color: "var(--bone-dim)", padding: "4px 10px", fontSize: 12, letterSpacing: 1.4, cursor: "pointer", fontFamily: "inherit", textTransform: "uppercase" }}>
          {lang === "en" ? "EN · PT" : "PT · EN"}
        </button>
      </header>

      {/* TOOLBAR */}
      <div style={{ width: "100%", maxWidth: 920, marginBottom: 22, display: "grid", gridTemplateColumns: "1.4fr 1px 1fr", gap: 22, alignItems: "start" }}>
        {/* SHAPES */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div className="knm-label">{T.shapes}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <button className="knm-btn-primary" onClick={saveCurrentShape}>{T.save}</button>
            <button className="knm-btn" onClick={exportShapes}>{T.export}</button>
            <button className="knm-btn" onClick={() => importFileRef.current?.click()}>{T.import}</button>
            <input ref={importFileRef} type="file" accept="application/json" onChange={onImportFile} style={{ display: "none" }} />
          </div>
          {savedShapes.length > 0 && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
              {savedShapes.map(s => (
                <span key={s.name} className="knm-chip" onClick={() => loadShape(s)}>
                  <span>{s.name}</span>
                  <button className="knm-chip-x" onClick={(e) => { e.stopPropagation(); if (window.confirm(T.deleteConfirm(s.name))) deleteShape(s.name); }}>×</button>
                </span>
              ))}
            </div>
          )}
        </div>

        <div className="knm-divider" />

        {/* MODE */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div className="knm-label">{T.mode}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            {!editMode && (
              <button className="knm-btn" onClick={() => setEditMode(true)}>{T.edit}</button>
            )}
            {['thin', 'full', 'string'].map(mode => (
              <button key={mode} className={`knm-btn ${strandMode === mode ? "is-active" : ""}`} onClick={() => setStrandMode(mode)}>
                {T[mode]}
              </button>
            ))}
            <span style={{ width: 1, alignSelf: "stretch", background: "var(--hair)", margin: "0 4px" }} />
            <button className="knm-btn" onClick={() => setZoom(z => Math.max(0.3, +(z - 0.15).toFixed(2)))}>−</button>
            <span className="knm-label" style={{ minWidth: 38, textAlign: "center" }}>{Math.round(zoom * 100)}%</span>
            <button className="knm-btn" onClick={() => setZoom(z => Math.min(4, +(z + 0.15).toFixed(2)))}>+</button>
            <button className="knm-btn" onClick={() => setZoom(1)}>{T.reset}</button>
          </div>
        </div>

      </div>

      {cycles.length > 0 && cycles.length <= 30 && (
        <div style={{ width: "100%", maxWidth: 920, display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 18, paddingTop: 14, borderTop: "1px solid var(--hair)" }}>
          <div className="knm-label" style={{ marginRight: 10 }}>{T.cycles}</div>
          {cycles.map((c, i) => {
            const vis = isCycleVisible(i);
            const col = getCycleColor(i);
            const openPicker = () => {
              const inp = colorInputRefs.current[i];
              if (inp) inp.click();
            };
            const clearLongPress = () => {
              if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
              pressStartRef.current = null;
            };
            return (
              <div key={i} style={{ position: "relative", display: "inline-block" }}>
                <button
                  onClick={() => {
                    if (longPressFiredRef.current) { longPressFiredRef.current = false; return; }
                    toggleCycle(i);
                  }}
                  onDoubleClick={(e) => { e.preventDefault(); openPicker(); }}
                  onContextMenu={(e) => { e.preventDefault(); openPicker(); }}
                  onPointerDown={(e) => {
                    pressStartRef.current = { x: e.clientX, y: e.clientY };
                    longPressFiredRef.current = false;
                    longPressTimerRef.current = setTimeout(() => {
                      longPressFiredRef.current = true;
                      longPressTimerRef.current = null;
                      openPicker();
                    }, 450);
                  }}
                  onPointerUp={clearLongPress}
                  onPointerLeave={clearLongPress}
                  onPointerCancel={clearLongPress}
                  onPointerMove={(e) => {
                    const s = pressStartRef.current;
                    if (s && (Math.abs(e.clientX - s.x) > 5 || Math.abs(e.clientY - s.y) > 5)) clearLongPress();
                  }}
                  style={{ padding: "3px 8px", background: vis ? col : "transparent", color: vis ? "#000" : "#6a6050",
                    border: `2px solid ${vis ? col : "#332e24"}`, borderRadius: 4, cursor: "pointer",
                    fontSize: 11, fontWeight: "bold", fontFamily: "inherit", minWidth: 28, opacity: vis ? 1 : 0.5 }}>
                  {i + 1}
                </button>
                <input
                  type="color"
                  ref={el => { colorInputRefs.current[i] = el; }}
                  value={col}
                  onChange={(e) => setCycleColor(i, e.target.value)}
                  style={{ position: "absolute", left: 0, top: 0, width: 1, height: 1, opacity: 0, pointerEvents: "none", border: "none", padding: 0 }}
                />
              </div>
            );
          })}
        </div>
      )}

      {editMode && (
        <div className="knm-frame" style={{ position: "relative", marginBottom: 16 }}>
          <button onClick={() => setEditMode(false)}
            style={{ position: "absolute", top: 6, right: 8, background: "transparent", border: "none", color: "var(--bone-dim)", fontSize: 16, padding: "4px 8px", cursor: "pointer" }}>×</button>
          <div style={{ display: "flex", gap: 16, alignItems: "center", marginBottom: 12, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span className="knm-label">W</span>
              <input type="number" min={3} max={100} value={wDraft}
                onFocus={() => { wDimFocusRef.current = true; }}
                onChange={e => {
                  const raw = e.target.value;
                  setWDraft(raw);
                  const v = parseInt(raw, 10);
                  if (!Number.isNaN(v) && v >= 3 && v <= 100 && v !== gridW) resizeGrid(v, gridH);
                }}
                onBlur={commitGridW}
                onKeyDown={e => { if (e.key === "Enter") { e.currentTarget.blur(); } }}
                className="knm-num" />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span className="knm-label">H</span>
              <input type="number" min={3} max={100} value={hDraft}
                onFocus={() => { hDimFocusRef.current = true; }}
                onChange={e => {
                  const raw = e.target.value;
                  setHDraft(raw);
                  const v = parseInt(raw, 10);
                  if (!Number.isNaN(v) && v >= 3 && v <= 100 && v !== gridH) resizeGrid(gridW, v);
                }}
                onBlur={commitGridH}
                onKeyDown={e => { if (e.key === "Enter") { e.currentTarget.blur(); } }}
                className="knm-num" />
            </div>
            <div style={{ flex: 1 }} />
            <button className="knm-btn" onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(true))); setAnimProgress({}); }}>{T.fill}</button>
            <button className="knm-btn" onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(false))); setAnimProgress({}); }}>{T.clear}</button>
          </div>
          <div ref={editorRef}
            onPointerDown={onEditorPointerDown} onPointerMove={onEditorPointerMove} onPointerUp={onEditorPointerUp} onPointerCancel={onEditorPointerUp}
            style={{ display: "inline-grid", gridTemplateColumns: `repeat(${gridW}, ${editorCellSize}px)`,
              border: "1px solid #332e24", borderRadius: 3, padding: "14px 2px 2px 2px", background: "#0c0f12",
              userSelect: "none", touchAction: "none", cursor: "crosshair", position: "relative" }}>
            {cells.flatMap((row, y) => row.map((on, x) => (
              <div key={`${x},${y}`} style={{
                width: editorCellSize, height: editorCellSize,
                background: on ? "#2a4a3a" : "#1a1712",
                border: "1px solid #28231b",
              }} />
            )))}
            {edgeRuns.map((r, i) => {
              const labelStyle = {
                position: "absolute", pointerEvents: "none",
                fontSize: 10, fontFamily: "inherit", color: "#c8a96e",
                textShadow: "0 0 3px #16130f, 0 0 3px #16130f, 0 0 2px #16130f",
                lineHeight: 1, fontWeight: 600,
              };
              if (r.orient === "h") {
                const cx = 2 + ((r.x0 + r.x1) / 2) * editorCellSize;
                const cy = 14 + r.y * editorCellSize + (r.filledAbove ? 2 : -12);
                return <div key={`h${i}`} style={{ ...labelStyle, left: cx, top: cy, transform: "translateX(-50%)" }}>{r.len}</div>;
              } else {
                const cy = 14 + ((r.y0 + r.y1) / 2) * editorCellSize;
                const cx = 2 + r.x * editorCellSize + (r.filledLeft ? 2 : -10);
                return <div key={`v${i}`} style={{ ...labelStyle, left: cx, top: cy, transform: "translateY(-50%)" }}>{r.len}</div>;
              }
            })}
            {marquee && (() => {
              const xa = Math.min(marquee.x0, marquee.x1), xb = Math.max(marquee.x0, marquee.x1);
              const ya = Math.min(marquee.y0, marquee.y1), yb = Math.max(marquee.y0, marquee.y1);
              return (
                <div style={{
                  position: "absolute", pointerEvents: "none",
                  left: 2 + xa * editorCellSize, top: 14 + ya * editorCellSize,
                  width: (xb - xa + 1) * editorCellSize, height: (yb - ya + 1) * editorCellSize,
                  background: marquee.val ? "rgba(74,170,120,0.25)" : "rgba(200,80,80,0.22)",
                  border: `1px solid ${marquee.val ? "#4aaa78" : "#c85050"}`,
                }} />
              );
            })()}
          </div>
          <div className="knm-label" style={{ marginTop: 10, textAlign: "center" }}>{T.dragHint}</div>
        </div>
      )}

      <div ref={knotWrapRef} style={{ background: bgColor, border: "1px solid var(--hair)", padding: 6 }}>
        <svg width={svgW} height={svgH} viewBox={`0 0 ${svgW} ${svgH}`} style={{ display: "block" }}>
          <defs>
            <filter id="glo"><feGaussianBlur stdDeviation="2" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>

          {/* Loom paper background — broken weave diagonals across full viewport */}
          <g style={{ pointerEvents: "none" }}>
            {loomBackground.map((s, i) => (
              <line key={`loom${i}`} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke="rgba(200,210,220,0.13)" strokeWidth={1.4} strokeLinecap="round" />
            ))}
          </g>

          {/* Boundary edges */}
          {boundaryEdges.map((e, i) => (
            <line key={`be${i}`} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="#2a2519" strokeWidth={1.5} />
          ))}

          {/* Strands */}
          {renderElements.map((el, i) => (
            <line key={i} x1={el.x1} y1={el.y1} x2={el.x2} y2={el.y2}
              stroke={el.color} strokeWidth={el.w} strokeLinecap="butt" />
          ))}

          {/* Corner arcs */}
          {cornerArcs.map((arc, i) => (
            <path key={`ca${i}`} d={`M${arc.sx1},${arc.sy1} A${arc.r},${arc.r} 0 0,${arc.sweep} ${arc.sx2},${arc.sy2}`}
              fill="none" stroke={arc.color} strokeWidth={sw} strokeLinecap="butt" />
          ))}

          {/* Rounded caps at boundary endpoints */}
          {renderElements.filter(el => el.type === 'strand' && (el.edgeStart || el.edgeEnd)).map((el, i) => {
            const r = el.w / 2;
            const caps = [];
            if (el.edgeStart) caps.push(<circle key={`es${i}`} cx={el.x1} cy={el.y1} r={r} fill={el.color} />);
            if (el.edgeEnd) caps.push(<circle key={`ee${i}`} cx={el.x2} cy={el.y2} r={r} fill={el.color} />);
            return caps;
          })}

          {/* Gap dots */}
          {gapDots.map(g => {
            const sel = selGap === g.i;
            const ci = cycles.findIndex(c => c.gaps.has(g.i));
            const vis = ci >= 0 && isCycleVisible(ci);
            const col = vis && ci >= 0 ? getCycleColor(ci) : hoverGap === g.i ? "#8a7e6b" : "#2e2920";
            return (
              <g key={`g${g.i}`}>
                <circle cx={g.x} cy={g.y} r={gr * 1.8} fill="transparent" style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHoverGap(g.i)} onMouseLeave={() => setHoverGap(null)} onClick={() => clickGap(g.i)} />
                <circle cx={g.x} cy={g.y} r={sel ? gr * 1.15 : gr * 0.65} fill={col} opacity={vis || sel ? 1 : 0.45}
                  style={{ pointerEvents: "none" }} filter={sel ? "url(#glo)" : undefined} />
                {sel && <circle cx={g.x} cy={g.y} r={gr * 2} fill="none" stroke="#c8a96e" strokeWidth={1.2} opacity={0.4} style={{ pointerEvents: "none" }} />}
              </g>
            );
          })}

          {/* Nail dots and axis labels */}
          {(() => {
            const xs = [...new Set(nailPositions.map(n => n.x))].sort((a,b) => a-b);
            const ys = [...new Set(nailPositions.map(n => n.y))].sort((a,b) => a-b);
            const off = cellSz * 0.4;
            const fs = Math.max(9, Math.min(13, cellSz * 0.35));
            const els = [];
            // Dots
            nailPositions.forEach((n, i) => els.push(
              <circle key={`nail${i}`} cx={toX(n.x)} cy={toY(n.y)} r={4}
                fill={n.type === 'corner' ? "#ff4444" : "#44ff44"} opacity={0.8} style={{ pointerEvents: "none" }} />
            ));
            // X-axis labels along bottom
            xs.forEach((x, i) => els.push(
              <text key={`xl${i}`} x={toX(x)} y={toY(H) + off + fs} textAnchor="middle"
                fill="#c8a96e" fontSize={fs} fontFamily="inherit" style={{ pointerEvents: "none" }}>
                {i + 1}
              </text>
            ));
            // Y-axis labels along left (flipped: bottom=1)
            ys.forEach((y, i) => els.push(
              <text key={`yl${i}`} x={toX(0) - off} y={toY(y) + fs * 0.35} textAnchor="end"
                fill="#c8a96e" fontSize={fs} fontFamily="inherit" style={{ pointerEvents: "none" }}>
                {ys.length - i}
              </text>
            ));
            return els;
          })()}

        </svg>
      </div>

      <div style={{ marginTop: 10, fontSize: 12, letterSpacing: 1.4, color: "var(--bone-dim)", textTransform: "uppercase", textAlign: "center" }}>
        {gridW}×{gridH} · {cycles.length} {cycles.length !== 1 ? T.cyclesPlural : T.cycle} · {T[strandMode] || strandMode}
      </div>
      <div style={{ marginTop: 8, fontSize: 11, color: "#5a5244", textAlign: "center" }}>
        {selGap !== null && active
          ? <span style={{ color: "#9a8e78" }}>Strand: {active.gaps.size} gaps, {active.points.length - 1} segments</span>
          : "Tap a gap dot to isolate a strand"}
        <span onClick={() => setAnimate(!animate)}
          style={{ marginLeft: 8, cursor: "pointer", color: animate ? "#9a8e78" : "#5a5244" }}>
          · animate: {animate ? "on" : "off"}
        </span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CelticKnotCustom />);
</script>
</body>
</html>
