<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celtic Knot Maker — Custom Shapes</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// ========== SHAPE PRESETS ==========
function makePreset(name, curW, curH) {
  if (name === 'staircase-boot') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 4 ? 8 + y * 2 : gw;
      for (let x = 0; x < Math.min(w, gw); x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'L-shape') {
    const gw = 18, gh = 10;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++) {
      const w = y < 2 ? 8 : gw;
      for (let x = 0; x < w; x++) cells[y][x] = true;
    }
    return { cells, gw, gh };
  }
  if (name === 'cross') {
    const gw = 15, gh = 15;
    const cells = Array.from({length: gh}, () => Array(gw).fill(false));
    for (let y = 0; y < gh; y++)
      for (let x = 0; x < gw; x++)
        if ((x >= 5 && x < 10) || (y >= 5 && y < 10)) cells[y][x] = true;
    return { cells, gw, gh };
  }
  // rectangle — fills current grid size
  const gw = curW || 18, gh = curH || 10;
  return { cells: Array.from({length: gh}, () => Array(gw).fill(true)), gw, gh };
}

// ========== CELL-GRID SHAPE FUNCTIONS ==========
// These replace the original's W/H/nw/nh parameterized functions
// Coordinate space is [0, gw] × [0, gh], same as original's [0,W] × [0,H]

function isInteriorCrossing(ix, iy, cells, gw, gh) {
  // Interior crossing = all 4 surrounding cells active
  if (ix < 1 || iy < 1 || ix >= gw || iy >= gh) return false;
  return cells[iy-1][ix-1] && cells[iy-1][ix] && cells[iy][ix-1] && cells[iy][ix];
}

function buildEdges(cells, gw, gh) {
  // Build merged boundary edge segments — same format as original
  const hUnits = []; // {y, x} for unit h-edge at (x,y)→(x+1,y)
  const vUnits = []; // {x, y} for unit v-edge at (x,y)→(x,y+1)
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below) hUnits.push({y, x});
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right) vUnits.push({x, y});
    }
  // Merge consecutive horizontal edges at same y
  const edges = [];
  const hByY = {};
  for (const e of hUnits) { if (!hByY[e.y]) hByY[e.y] = []; hByY[e.y].push(e.x); }
  for (const y in hByY) {
    const xs = hByY[y].sort((a,b) => a-b);
    let start = xs[0];
    for (let i = 1; i <= xs.length; i++) {
      if (i < xs.length && xs[i] === xs[i-1] + 1) continue;
      edges.push({ y: +y, x0: start, x1: xs[i-1] + 1, type: 'h' });
      if (i < xs.length) start = xs[i];
    }
  }
  // Merge consecutive vertical edges at same x
  const vByX = {};
  for (const e of vUnits) { if (!vByX[e.x]) vByX[e.x] = []; vByX[e.x].push(e.y); }
  for (const x in vByX) {
    const ys = vByX[x].sort((a,b) => a-b);
    let start = ys[0];
    for (let i = 1; i <= ys.length; i++) {
      if (i < ys.length && ys[i] === ys[i-1] + 1) continue;
      edges.push({ x: +x, y0: start, y1: ys[i-1] + 1, type: 'v' });
      if (i < ys.length) start = ys[i];
    }
  }
  return edges;
}

function buildGaps(cells, gw, gh) {
  // Each unit boundary edge has a gap at its midpoint
  // Returns array of {x, y, isH, interiorDir}
  const gaps = [];
  for (let y = 0; y <= gh; y++)
    for (let x = 0; x < gw; x++) {
      const above = y > 0 ? cells[y-1][x] : false;
      const below = y < gh ? cells[y][x] : false;
      if (above !== below)
        gaps.push({ x: x + 0.5, y, isH: true, interiorBelow: !!below });
    }
  for (let x = 0; x <= gw; x++)
    for (let y = 0; y < gh; y++) {
      const left = x > 0 ? cells[y][x-1] : false;
      const right = x < gw ? cells[y][x] : false;
      if (left !== right)
        gaps.push({ x, y: y + 0.5, isH: false, interiorRight: !!right });
    }
  return gaps;
}

function getInitialDir(gap) {
  // Same direction convention as original:
  // Top edge (interior below): dx=1, dy=1
  // Right edge (interior left): dx=-1, dy=1
  // Bottom edge (interior above): dx=-1, dy=-1
  // Left edge (interior right): dx=1, dy=-1
  if (gap.isH) {
    return gap.interiorBelow ? { dx: 1, dy: 1 } : { dx: -1, dy: -1 };
  }
  return gap.interiorRight ? { dx: 1, dy: -1 } : { dx: -1, dy: 1 };
}

function pointToGapIdx(px, py, gaps) {
  for (let i = 0; i < gaps.length; i++)
    if (Math.abs(px - gaps[i].x) < 0.1 && Math.abs(py - gaps[i].y) < 0.1) return i;
  return -1;
}

function isOnBoundary(px, py, cells, gw, gh) {
  const E = 0.01;
  const iy = Math.round(py), ix = Math.round(px);
  // Horizontal edge check (py near integer)
  if (Math.abs(py - iy) < E) {
    const cx = Math.floor(px);
    if (cx >= 0 && cx < gw) {
      const above = iy > 0 ? !!cells[iy-1]?.[cx] : false;
      const below = iy < gh ? !!cells[iy]?.[cx] : false;
      if (above !== below) return true;
    }
  }
  // Vertical edge check (px near integer)
  if (Math.abs(px - ix) < E) {
    const cy = Math.floor(py);
    if (cy >= 0 && cy < gh) {
      const left = ix > 0 ? !!cells[cy]?.[ix-1] : false;
      const right = ix < gw ? !!cells[cy]?.[ix] : false;
      if (left !== right) return true;
    }
  }
  return false;
}

// ========== BILLIARD TRACING — identical to original ==========
function tracePath(startIdx, gaps, edges, cells, gw, gh) {
  const EPS = 1e-9;
  const sc = gaps[startIdx];
  const pts = [{ x: sc.x, y: sc.y }];
  let { dx, dy } = getInitialDir(sc);
  let x = sc.x, y = sc.y;
  const maxIter = edges.length * 200 + 2000;
  for (let iter = 0; iter < maxIter; iter++) {
    let minT = Infinity, hitH = false, hitV = false;
    for (const edge of edges) {
      let t;
      if (edge.type === 'h') {
        if (Math.abs(dy) < EPS) continue;
        t = (edge.y - y) / dy;
        if (t < EPS) continue;
        const hx = x + dx * t;
        if (hx < edge.x0 - EPS || hx > edge.x1 + EPS) continue;
      } else {
        if (Math.abs(dx) < EPS) continue;
        t = (edge.x - x) / dx;
        if (t < EPS) continue;
        const hy = y + dy * t;
        if (hy < edge.y0 - EPS || hy > edge.y1 + EPS) continue;
      }
      if (t < minT - EPS) { minT = t; hitH = edge.type === 'h'; hitV = edge.type === 'v'; }
      else if (Math.abs(t - minT) < EPS * 100) {
        if (edge.type === 'h') hitH = true;
        if (edge.type === 'v') hitV = true;
      }
    }
    if (minT === Infinity || minT > 1e6) break;
    x += dx * minT; y += dy * minT;
    x = Math.round(x * 1e6) / 1e6; y = Math.round(y * 1e6) / 1e6;
    pts.push({ x, y });
    if (pts.length > 2 && Math.abs(x - sc.x) < 0.01 && Math.abs(y - sc.y) < 0.01) break;
    if (hitH && hitV) { dx = -dx; dy = -dy; }
    else if (hitH) dy = -dy;
    else if (hitV) dx = -dx;
  }
  return pts;
}

function getAllCycles(cells, gw, gh) {
  const edges = buildEdges(cells, gw, gh);
  const gaps = buildGaps(cells, gw, gh);
  if (gaps.length === 0) return { cycles: [], gaps, edges };
  const vis = new Set(), cycles = [];
  for (let g = 0; g < gaps.length; g++) {
    if (vis.has(g)) continue;
    const pts = tracePath(g, gaps, edges, cells, gw, gh);
    const gapSet = new Set();
    for (const p of pts) {
      const gi = pointToGapIdx(p.x, p.y, gaps);
      if (gi >= 0) { gapSet.add(gi); vis.add(gi); }
    }
    cycles.push({ startGap: g, points: pts, gaps: gapSet });
  }
  return { cycles, gaps, edges };
}

// ========== COLORS & UTILS — identical to original ==========
const COLORS = [
  "#2E7D7D", "#B5541C", "#3D5A80", "#D4A017",
  "#8B2E52", "#6B8E6B", "#5B8DB8", "#C25476",
  "#C8804A", "#4A7C5E", "#A67C3C", "#5BA8A0",
];

function subtractInterval(a0, a1, b0, b1) {
  if (b0 >= a1 || b1 <= a0) return [[a0, a1]];
  const r = [];
  if (a0 < b0) r.push([a0, b0]);
  if (b1 < a1) r.push([b1, a1]);
  return r;
}

// ========== MAIN COMPONENT ==========
function CelticKnotCustom() {
  const [cells, setCells] = useState(() => makePreset('L-shape').cells);
  const [gridW, setGridW] = useState(18);
  const [gridH, setGridH] = useState(10);
  const [presetName, setPresetName] = useState('L-shape');
  const [selGap, setSelGap] = useState(null);
  const [showAll, setShowAll] = useState(true);
  const [hoverGap, setHoverGap] = useState(null);
  const [showGrid, setShowGrid] = useState(true);
  const [cycleColors, setCycleColors] = useState({});
  const [visibleCycles, setVisibleCycles] = useState({});
  const [animate, setAnimate] = useState(true);
  const [strandMode, setStrandMode] = useState('thin'); // 'thin', 'full', 'string'
  const [animProgress, setAnimProgress] = useState({});
  const [editMode, setEditMode] = useState(false);
  const [painting, setPainting] = useState(null);

  // W and H for the rendering code — same role as original
  const W = gridW, H = gridH;

  const loadPreset = useCallback((name) => {
    const p = makePreset(name, gridW, gridH);
    setCells(p.cells); setGridW(p.gw); setGridH(p.gh); setPresetName(name);
    setSelGap(null); setShowAll(true); setCycleColors({}); setVisibleCycles({}); setAnimProgress({});
  }, []);

  const toggleCell = useCallback((x, y, forceVal) => {
    setCells(prev => {
      const next = prev.map(r => [...r]);
      next[y][x] = forceVal !== undefined ? forceVal : !prev[y][x];
      return next;
    });
    setSelGap(null); setShowAll(true); setAnimProgress({});
  }, []);

  const resizeGrid = useCallback((newW, newH) => {
    setCells(prev => Array.from({length: newH}, (_, y) =>
      Array.from({length: newW}, (_, x) => (y < prev.length && x < (prev[0]?.length || 0)) ? prev[y][x] : false)
    ));
    setGridW(newW); setGridH(newH);
    setSelGap(null); setShowAll(true); setAnimProgress({});
  }, []);

  const { cycles, gaps, edges } = useMemo(() => getAllCycles(cells, gridW, gridH), [cells, gridW, gridH]);
  const active = useMemo(() => selGap !== null ? cycles.find(c => c.gaps.has(selGap)) : null, [selGap, cycles]);

  const svgW = 800, svgH = 560, pad = 56;
  const cellSz = Math.min((svgW - 2 * pad) / W, (svgH - 2 * pad) / H);
  const ox = (svgW - W * cellSz) / 2, oy = (svgH - H * cellSz) / 2;

  const toX = useCallback(x => ox + x * cellSz, [ox, cellSz]);
  const toY = useCallback(y => oy + y * cellSz, [oy, cellSz]);

  const gapDots = useMemo(() => gaps.map((g, i) => ({ i, x: toX(g.x), y: toY(g.y) })), [gaps, toX, toY]);

  const gr = Math.max(5, cellSz * 0.13);
  const sw = cellSz * (strandMode === 'full' ? 0.707 : strandMode === 'string' ? 0.12 : 0.45);
  const bgColor = "#0c0f12";

  // ===== WEAVE GRID LINES — same logic as original, cell-based clipping =====
  const weaveLines = useMemo(() => {
    const lines = [];
    // Backslash family: y = x + kVal, kVal = k + 0.5
    for (let k = -W; k <= H; k++) {
      const kVal = k + 0.5;
      // Find active x-segments: line is interior in column n if both cells (n, n+k) and (n, n+k+1) are active
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, -k), nMax = Math.min(W - 1, H - k - 2);
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = n + k, cy2 = n + k + 1;
        if (cy1 >= 0 && cy2 < H && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);

      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(x0 + kVal);
        const sx1 = toX(x1), sy1 = toY(x1 + kVal);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        // Cuts — identical to original
        const cuts = [];
        for (let m = -1; m <= W + H; m++) {
          const mVal = m + 0.5;
          const ix = (mVal - kVal) / 2;
          const iy = (mVal + kVal) / 2;
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && isInteriorCrossing(Math.round(ix), Math.round(iy), cells, W, H)) {
            if ((k + m + W) % 2 === 1) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    // Forward-slash family: y = -x + mVal, mVal = m + 0.5
    for (let m = 0; m <= W + H - 1; m++) {
      const mVal = m + 0.5;
      // Find active x-segments: in column n, cells (n, m-n-1) and (n, m-n) must be active
      const activeSegs = [];
      let segStart = null;
      const nMin = Math.max(0, Math.ceil(mVal - H)), nMax = Math.min(W - 1, Math.floor(mVal - 1));
      for (let n = nMin; n <= nMax; n++) {
        const cy1 = m - n - 1, cy2 = m - n;
        if (cy1 >= 0 && cy2 < H && cy1 < H && cy2 >= 0 && n < W && cells[cy1][n] && cells[cy2][n]) {
          if (segStart === null) segStart = n;
        } else {
          if (segStart !== null) { activeSegs.push([segStart, n]); segStart = null; }
        }
      }
      if (segStart !== null) activeSegs.push([segStart, nMax + 1]);

      for (const [x0, x1] of activeSegs) {
        if (x1 - x0 < 0.01) continue;
        const sx0 = toX(x0), sy0 = toY(mVal - x0);
        const sx1 = toX(x1), sy1 = toY(mVal - x1);
        const ddx = sx1 - sx0, ddy = sy1 - sy0;
        const len = Math.hypot(ddx, ddy);
        if (len < 1) continue;
        const ux = ddx / len, uy = ddy / len;
        const cuts = [];
        for (let k = -W; k <= H; k++) {
          const kVal2 = k + 0.5;
          const ix = (mVal - kVal2) / 2;
          const iy = (mVal + kVal2) / 2;
          if (ix > x0 + 0.01 && ix < x1 - 0.01 && isInteriorCrossing(Math.round(ix), Math.round(iy), cells, W, H)) {
            if ((k + m + W) % 2 === 0) cuts.push({ sx: toX(ix), sy: toY(iy) });
          }
        }
        lines.push({ sx0, sy0, sx1, sy1, ux, uy, cuts });
      }
    }
    return lines;
  }, [cells, W, H, cellSz, toX, toY]);

  // ===== CROSSING MAP — identical to original =====
  function buildCrossingMap(pointsPerCycle) {
    const map = new Map();
    for (const [ci, pts] of pointsPerCycle) {
      for (let seg = 0; seg < pts.length - 1; seg++) {
        const p1 = pts[seg], p2 = pts[seg + 1];
        const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
        if (sdx === 0 || sdy === 0) continue;
        const isBS = (sdx === sdy);
        const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
        for (let ix = Math.ceil(minX + 0.01); ix <= Math.floor(maxX - 0.01); ix++) {
          const t = (ix - p1.x) / (p2.x - p1.x);
          const iy = Math.round(p1.y + (p2.y - p1.y) * t);
          if (isInteriorCrossing(ix, iy, cells, W, H)) {
            const key = `${ix},${iy}`;
            if (!map.has(key)) map.set(key, { bs: new Set(), fs: new Set() });
            const entry = map.get(key);
            if (isBS) entry.bs.add(ci); else entry.fs.add(ci);
          }
        }
      }
    }
    return map;
  }

  // ===== STRAND RENDERING — identical to original =====
  function renderStrandSVG(pts, color, cycleIdx, visibleSet, crossingMap) {
    const elements = [];
    const lineW = sw;
    const gap = strandMode === 'string' ? cellSz * 0.16 : sw / 2;
    for (let seg = 0; seg < pts.length - 1; seg++) {
      const p1 = pts[seg], p2 = pts[seg + 1];
      const sx1 = toX(p1.x), sy1 = toY(p1.y);
      const sx2 = toX(p2.x), sy2 = toY(p2.y);
      const ddx = sx2 - sx1, ddy = sy2 - sy1;
      const len = Math.hypot(ddx, ddy);
      if (len < 0.5) continue;
      const ux = ddx / len, uy = ddy / len;
      const sdx = Math.sign(p2.x - p1.x), sdy = Math.sign(p2.y - p1.y);
      const p1Edge = isOnBoundary(p1.x, p1.y, cells, W, H);
      const p2Edge = isOnBoundary(p2.x, p2.y, cells, W, H);
      if (sdx === 0 || sdy === 0) {
        elements.push({ type: 'strand', x1: sx1, y1: sy1, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: p1Edge, edgeEnd: p2Edge });
        continue;
      }
      const isBS = (sdx === sdy);
      const cuts = [];
      const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
      // *** KEY: use k/m family iteration, identical to original ***
      if (isBS) {
        const kVal = p1.y - p1.x;
        const ki = Math.round(kVal - 0.5);
        for (let mi = -1; mi <= W + H; mi++) {
          const mVal = mi + 0.5;
          const ix = (mVal - kVal) / 2, iy = (mVal + kVal) / 2;
          const ixR = Math.round(ix), iyR = Math.round(iy);
          if (ix > minX + 0.01 && ix < maxX - 0.01 && isInteriorCrossing(ixR, iyR, cells, W, H)) {
            if ((ki + mi + W) % 2 === 1) {
              const entry = crossingMap.get(`${ixR},${iyR}`);
              if (entry) {
                const hasVisibleOver = [...entry.fs].some(ci => ci !== cycleIdx && visibleSet.has(ci));
                if (hasVisibleOver) cuts.push({ sx: toX(ix), sy: toY(iy) });
              }
            }
          }
        }
      } else {
        const mVal = p1.y + p1.x;
        const mi = Math.round(mVal - 0.5);
        for (let ki = -W; ki <= H; ki++) {
          const kVal2 = ki + 0.5;
          const ix = (mVal - kVal2) / 2, iy = (mVal + kVal2) / 2;
          const ixR = Math.round(ix), iyR = Math.round(iy);
          if (ix > minX + 0.01 && ix < maxX - 0.01 && isInteriorCrossing(ixR, iyR, cells, W, H)) {
            if ((ki + mi + W) % 2 === 0) {
              const entry = crossingMap.get(`${ixR},${iyR}`);
              if (entry) {
                const hasVisibleOver = [...entry.bs].some(ci => ci !== cycleIdx && visibleSet.has(ci));
                if (hasVisibleOver) cuts.push({ sx: toX(ix), sy: toY(iy) });
              }
            }
          }
        }
      }
      cuts.sort((a, b) => (a.sx - sx1) * ux + (a.sy - sy1) * uy - ((b.sx - sx1) * ux + (b.sy - sy1) * uy));
      let cx = sx1, cy = sy1;
      let isFirst = true;
      for (const cut of cuts) {
        const gsx = cut.sx - ux * gap, gsy = cut.sy - uy * gap;
        const proj = (gsx - cx) * ux + (gsy - cy) * uy;
        if (proj > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: gsx, y2: gsy, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: false });
        cx = cut.sx + ux * gap; cy = cut.sy + uy * gap;
        isFirst = false;
      }
      const projEnd = (sx2 - cx) * ux + (sy2 - cy) * uy;
      if (projEnd > 0.5) elements.push({ type: 'strand', x1: cx, y1: cy, x2: sx2, y2: sy2, color, w: lineW, z: 2, edgeStart: isFirst && p1Edge, edgeEnd: p2Edge });
    }
    return elements;
  }

  // ===== All remaining logic identical to original =====
  const getCycleColor = useCallback((i) => {
    if (strandMode === 'string') return "#c8a96e";
    return cycleColors[i] || COLORS[i % COLORS.length];
  }, [cycleColors, strandMode]);
  const setCycleColor = useCallback((i, color) => setCycleColors(prev => ({ ...prev, [i]: color })), []);

  const isCycleVisible = useCallback((i) => {
    if (showAll) return visibleCycles[i] !== false;
    return visibleCycles[i] === true;
  }, [showAll, visibleCycles]);

  const animStartTime = useRef({});
  const toggleCycle = useCallback((i) => {
    const willBeVisible = !isCycleVisible(i);
    setVisibleCycles(prev => ({ ...prev, [i]: willBeVisible }));
    if (willBeVisible && animate) {
      animStartTime.current[i] = performance.now();
      setAnimProgress(prev => ({ ...prev, [i]: 0 }));
    } else if (willBeVisible) {
      setAnimProgress(prev => ({ ...prev, [i]: Infinity }));
    }
  }, [isCycleVisible, animate]);

  useEffect(() => {
    if (!animate) return;
    let animating = false;
    cycles.forEach((c, i) => {
      if (isCycleVisible(i) && (animProgress[i] ?? Infinity) < c.points.length - 1) {
        animating = true;
        if (animStartTime.current[i] == null) animStartTime.current[i] = performance.now();
      }
    });
    if (!animating) return;
    const id = requestAnimationFrame((now) => {
      setAnimProgress(prev => {
        const next = { ...prev };
        cycles.forEach((c, i) => {
          const total = c.points.length - 1;
          if (isCycleVisible(i) && (prev[i] ?? Infinity) < total) {
            const elapsed = (now - (animStartTime.current[i] ?? now)) / 1000;
            const duration = Math.max(2.5, total * 0.06);
            const frac = Math.min(elapsed / duration, 1);
            next[i] = frac * total;
            if (frac >= 1) { next[i] = total; delete animStartTime.current[i]; }
          }
        });
        return next;
      });
    });
    return () => cancelAnimationFrame(id);
  }, [animate, animProgress, cycles, isCycleVisible]);

  const getVisiblePoints = useCallback((cycleIdx) => {
    if (!cycles[cycleIdx]) return [];
    const pts = cycles[cycleIdx].points;
    if (!pts || pts.length < 2) return pts || [];
    const prog = animProgress[cycleIdx];
    if (prog == null || prog >= pts.length - 1) return pts;
    const segIdx = Math.floor(prog);
    const segFrac = prog - segIdx;
    const visible = pts.slice(0, segIdx + 1);
    if (segIdx < pts.length - 1) {
      const p1 = pts[segIdx], p2 = pts[segIdx + 1];
      const frac = Math.max(0.001, segFrac);
      visible.push({ x: p1.x + (p2.x - p1.x) * frac, y: p1.y + (p2.y - p1.y) * frac });
    }
    return visible;
  }, [cycles, animProgress]);

  const renderElements = useMemo(() => {
    try {
      const visibleSet = new Set();
      cycles.forEach((c, i) => { if (isCycleVisible(i)) visibleSet.add(i); });
      const pointsPerCycle = new Map();
      for (const i of visibleSet) pointsPerCycle.set(i, getVisiblePoints(i));
      const crossingMap = buildCrossingMap(pointsPerCycle);
      const els = [];
      for (const i of visibleSet) {
        const pts = pointsPerCycle.get(i);
        if (pts && pts.length >= 2) els.push(...renderStrandSVG(pts, getCycleColor(i), i, visibleSet, crossingMap));
      }
      els.sort((a, b) => a.z - b.z);
      return els;
    } catch(e) { console.error('RENDER ERROR:', e); return []; }
  }, [cycles, isCycleVisible, cells, W, H, cellSz, toX, toY, sw, cycleColors, animProgress, getVisiblePoints]);

  const clickGap = useCallback(g => {
    const ci = cycles.findIndex(c => c.gaps.has(g));
    if (ci < 0) return;
    setSelGap(g);
    if (showAll) setShowAll(false);
    setVisibleCycles(prev => ({ ...prev, [ci]: true }));
    if (animate) {
      animStartTime.current[ci] = performance.now();
      setAnimProgress(prev => ({ ...prev, [ci]: 0 }));
    } else {
      setAnimProgress(prev => ({ ...prev, [ci]: Infinity }));
    }
  }, [cycles, animate, showAll]);

  // Boundary path — draw each boundary edge
  const boundaryEdges = useMemo(() => {
    return edges.map(e => {
      if (e.type === 'h') return { x1: toX(e.x0), y1: toY(e.y), x2: toX(e.x1), y2: toY(e.y) };
      return { x1: toX(e.x), y1: toY(e.y0), x2: toX(e.x), y2: toY(e.y1) };
    });
  }, [edges, toX, toY]);

  const editorCellSize = Math.min(28, Math.max(14, 420 / Math.max(gridW, gridH)));

  return (
    <div style={{ minHeight: "100vh", background: "#16130f", color: "#e0d5c0", fontFamily: "'Palatino Linotype','Book Antiqua',Palatino,serif", display: "flex", flexDirection: "column", alignItems: "center", padding: "20px 12px" }}>
      <h1 style={{ fontSize: 24, fontWeight: 400, letterSpacing: 4, color: "#c8a96e", margin: "0 0 2px", textTransform: "uppercase" }}>Celtic Knot Maker</h1>
      <p style={{ fontSize: 11, color: "#6a6050", letterSpacing: 2, margin: "0 0 14px" }}>CUSTOM SHAPE BUILDER</p>

      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", justifyContent: "center", marginBottom: 10 }}>
        <span style={{ fontSize: 10, color: "#6a6050", letterSpacing: 1 }}>PRESETS</span>
        {['rectangle', 'L-shape', 'staircase-boot', 'cross'].map(p => (
          <button key={p} onClick={() => loadPreset(p)}
            style={{ padding: "5px 12px", background: presetName === p ? "#c8a96e" : "transparent",
              color: presetName === p ? "#16130f" : "#9a8e78",
              border: "1px solid #332e24", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
            {p}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", justifyContent: "center", marginBottom: 10 }}>
        <button onClick={() => setEditMode(!editMode)}
          style={{ padding: "7px 14px", background: editMode ? "#c8a96e" : "transparent", color: editMode ? "#16130f" : "#c8a96e",
            border: "1px solid #c8a96e", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
          {editMode ? "EDITING" : "EDIT SHAPE"}
        </button>
        <button onClick={() => { setShowAll(true); setVisibleCycles({}); const full = {}; cycles.forEach((c, i) => { full[i] = Infinity; }); setAnimProgress(full); setSelGap(null); }}
          style={{ padding: "7px 14px", background: showAll ? "#c8a96e" : "transparent", color: showAll ? "#16130f" : "#c8a96e", border: "1px solid #c8a96e", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
          ALL ON
        </button>
        <button onClick={() => { setShowAll(false); setVisibleCycles({}); setAnimProgress({}); setSelGap(null); }}
          style={{ padding: "7px 14px", background: !showAll ? "#c8a96e" : "transparent", color: !showAll ? "#16130f" : "#c8a96e", border: "1px solid #c8a96e", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
          ALL OFF
        </button>
        <button onClick={() => setAnimate(!animate)}
          style={{ padding: "7px 12px", background: animate ? "#c8a96e" : "transparent", color: animate ? "#16130f" : "#c8a96e", border: "1px solid #c8a96e", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
          {animate ? "ANIM ON" : "ANIM OFF"}
        </button>
        {['thin', 'full', 'string'].map(mode => (
          <button key={mode} onClick={() => setStrandMode(mode)}
            style={{ padding: "7px 12px", background: strandMode === mode ? "#c8a96e" : "transparent", color: strandMode === mode ? "#16130f" : "#c8a96e", border: "1px solid #c8a96e", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit", textTransform: "uppercase" }}>
            {mode}
          </button>
        ))}
        <button onClick={() => setShowGrid(!showGrid)}
          style={{ padding: "7px 12px", background: showGrid ? "rgba(255,255,255,0.08)" : "transparent", color: showGrid ? "#9a8e78" : "#4a4438", border: "1px solid #332e24", borderRadius: 4, cursor: "pointer", fontSize: 11, letterSpacing: 1, fontFamily: "inherit" }}>
          GRID
        </button>
        <div style={{ padding: "5px 14px", border: "1px solid #332e24", borderRadius: 4, background: "#1e1b16", textAlign: "center" }}>
          <div style={{ fontSize: 9, color: "#6a6050", letterSpacing: 1 }}>CYCLES</div>
          <div style={{ fontSize: 22, color: "#c8a96e", fontWeight: "bold" }}>{cycles.length}</div>
        </div>
      </div>

      {cycles.length > 0 && cycles.length <= 30 && (
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", justifyContent: "center", marginBottom: 8 }}>
          <span style={{ fontSize: 10, color: "#6a6050", letterSpacing: 1, marginRight: 4 }}>CYCLES</span>
          {cycles.map((c, i) => {
            const vis = isCycleVisible(i);
            const col = getCycleColor(i);
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 2 }}>
                <button onClick={() => toggleCycle(i)}
                  style={{ padding: "4px 10px", background: vis ? col : "transparent", color: vis ? "#000" : "#6a6050",
                    border: `2px solid ${vis ? col : "#332e24"}`, borderRadius: 4, cursor: "pointer",
                    fontSize: 12, fontWeight: "bold", fontFamily: "inherit", minWidth: 32, opacity: vis ? 1 : 0.5 }}>
                  {i + 1}
                </button>
                <input type="color" value={col} onChange={e => setCycleColor(i, e.target.value)}
                  style={{ width: 18, height: 18, border: "none", borderRadius: 3, background: "transparent", cursor: "pointer", padding: 0 }} />
              </div>
            );
          })}
        </div>
      )}

      <div style={{ fontSize: 12, color: "#6a6050", marginBottom: 8, letterSpacing: 1, textAlign: "center" }}>
        {gridW + 1}×{gridH + 1} nails · {gaps.length} gaps · {cycles.length === 1 ? "Single-strand knot" : `${cycles.length}-component link`}
      </div>

      {editMode && (
        <div style={{ marginBottom: 12, padding: 12, border: "1px solid #332e24", borderRadius: 6, background: "#1a1712" }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 8, justifyContent: "center" }}>
            <span style={{ fontSize: 11, color: "#6a6050" }}>W nails</span>
            <input type="number" min={4} max={101} value={gridW + 1} onChange={e => { const v = parseInt(e.target.value); if (v >= 4 && v <= 101) resizeGrid(v - 1, gridH); }}
              style={{ width: 48, padding: "4px", fontSize: 12, color: "#c8a96e", background: "#1e1b16", border: "1px solid #332e24", borderRadius: 3, textAlign: "center", fontFamily: "inherit" }} />
            <span style={{ color: "#6a6050" }}>×</span>
            <span style={{ fontSize: 11, color: "#6a6050" }}>H nails</span>
            <input type="number" min={4} max={101} value={gridH + 1} onChange={e => { const v = parseInt(e.target.value); if (v >= 4 && v <= 101) resizeGrid(gridW, v - 1); }}
              style={{ width: 48, padding: "4px", fontSize: 12, color: "#c8a96e", background: "#1e1b16", border: "1px solid #332e24", borderRadius: 3, textAlign: "center", fontFamily: "inherit" }} />
            <button onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(true))); setAnimProgress({}); }}
              style={{ padding: "4px 10px", background: "transparent", color: "#9a8e78", border: "1px solid #332e24", borderRadius: 3, cursor: "pointer", fontSize: 10, fontFamily: "inherit" }}>FILL</button>
            <button onClick={() => { setCells(Array.from({length: gridH}, () => Array(gridW).fill(false))); setAnimProgress({}); }}
              style={{ padding: "4px 10px", background: "transparent", color: "#9a8e78", border: "1px solid #332e24", borderRadius: 3, cursor: "pointer", fontSize: 10, fontFamily: "inherit" }}>CLEAR</button>
          </div>
          <div style={{ display: "inline-block", border: "1px solid #332e24", borderRadius: 3, padding: 2, background: "#0c0f12", lineHeight: 0, userSelect: "none" }}
            onMouseLeave={() => setPainting(null)} onMouseUp={() => setPainting(null)}>
            {cells.map((row, y) => (
              <div key={y} style={{ display: "flex" }}>
                {row.map((on, x) => (
                  <div key={x}
                    onMouseDown={e => { e.preventDefault(); const val = !on; toggleCell(x, y, val); setPainting(val); }}
                    onMouseEnter={() => { if (painting !== null) toggleCell(x, y, painting); }}
                    style={{
                      width: editorCellSize, height: editorCellSize,
                      background: on ? "#2a4a3a" : "#1a1712",
                      border: "1px solid #28231b",
                      cursor: "pointer",
                      transition: "background 0.1s",
                    }}
                  />
                ))}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 10, color: "#4a4438", marginTop: 6, textAlign: "center" }}>Click and drag to paint cells on/off</div>
        </div>
      )}

      <div style={{ background: bgColor, borderRadius: 6, border: "1px solid #28231b", padding: 6, boxShadow: "0 6px 28px rgba(0,0,0,0.6)" }}>
        <svg width={svgW} height={svgH} viewBox={`0 0 ${svgW} ${svgH}`} style={{ display: "block" }}>
          <defs>
            <filter id="glo"><feGaussianBlur stdDeviation="2" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>

          {/* Boundary edges */}
          {boundaryEdges.map((e, i) => (
            <line key={`be${i}`} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="#2a2519" strokeWidth={1.5} />
          ))}

          {/* Weave grid */}
          {showGrid && weaveLines.map((line, idx) => {
            const { sx0, sy0, sx1, sy1, ux, uy, cuts } = line;
            const gapPx = cellSz * 0.16;
            const sortedCuts = [...cuts].sort((a, b) => (a.sx - sx0) * ux + (a.sy - sy0) * uy - ((b.sx - sx0) * ux + (b.sy - sy0) * uy));
            const parts = [];
            let cx = sx0, cy = sy0;
            for (const cut of sortedCuts) {
              const gsx = cut.sx - ux * gapPx, gsy = cut.sy - uy * gapPx;
              const proj = (gsx - cx) * ux + (gsy - cy) * uy;
              if (proj > 0.5) parts.push(`M${cx.toFixed(1)},${cy.toFixed(1)} L${gsx.toFixed(1)},${gsy.toFixed(1)}`);
              cx = cut.sx + ux * gapPx; cy = cut.sy + uy * gapPx;
            }
            const projEnd = (sx1 - cx) * ux + (sy1 - cy) * uy;
            if (projEnd > 0.5) parts.push(`M${cx.toFixed(1)},${cy.toFixed(1)} L${sx1.toFixed(1)},${sy1.toFixed(1)}`);
            return parts.length > 0 ? <path key={`wv${idx}`} d={parts.join(" ")} fill="none" stroke="rgba(255,255,255,0.09)" strokeWidth={1} strokeLinecap="round" /> : null;
          })}

          {/* Strands */}
          {renderElements.map((el, i) => (
            <line key={i} x1={el.x1} y1={el.y1} x2={el.x2} y2={el.y2}
              stroke={el.color} strokeWidth={el.w} strokeLinecap="butt" />
          ))}

          {/* Rounded caps at boundary endpoints */}
          {renderElements.filter(el => el.type === 'strand' && (el.edgeStart || el.edgeEnd)).map((el, i) => {
            const r = el.w / 2;
            const caps = [];
            if (el.edgeStart) caps.push(<circle key={`es${i}`} cx={el.x1} cy={el.y1} r={r} fill={el.color} />);
            if (el.edgeEnd) caps.push(<circle key={`ee${i}`} cx={el.x2} cy={el.y2} r={r} fill={el.color} />);
            return caps;
          })}

          {/* Gap dots */}
          {gapDots.map(g => {
            const sel = selGap === g.i;
            const ci = cycles.findIndex(c => c.gaps.has(g.i));
            const vis = ci >= 0 && isCycleVisible(ci);
            const col = vis && ci >= 0 ? getCycleColor(ci) : hoverGap === g.i ? "#8a7e6b" : "#2e2920";
            return (
              <g key={`g${g.i}`}>
                <circle cx={g.x} cy={g.y} r={gr * 1.8} fill="transparent" style={{ cursor: "pointer" }}
                  onMouseEnter={() => setHoverGap(g.i)} onMouseLeave={() => setHoverGap(null)} onClick={() => clickGap(g.i)} />
                <circle cx={g.x} cy={g.y} r={sel ? gr * 1.15 : gr * 0.65} fill={col} opacity={vis || sel ? 1 : 0.45}
                  style={{ pointerEvents: "none" }} filter={sel ? "url(#glo)" : undefined} />
                {sel && <circle cx={g.x} cy={g.y} r={gr * 2} fill="none" stroke="#c8a96e" strokeWidth={1.2} opacity={0.4} style={{ pointerEvents: "none" }} />}
              </g>
            );
          })}

          {hoverGap !== null && gapDots[hoverGap] && (
            <text x={gapDots[hoverGap].x} y={gapDots[hoverGap].y - gr * 2.5}
              textAnchor="middle" fill="#c8a96e" fontSize={11} fontFamily="inherit" style={{ pointerEvents: "none" }}>
              gap {hoverGap}
            </text>
          )}
        </svg>
      </div>

      <div style={{ marginTop: 12, maxWidth: 640, textAlign: "center", lineHeight: 1.7, fontSize: 13 }}>
        {selGap !== null && active ? (
          <span style={{ color: "#9a8e78" }}>
            <b style={{ color: "#c8a96e" }}>Gap {selGap}</b> — strand visits <b style={{ color: "#c8a96e" }}>{active.gaps.size}</b> gaps
            across <b style={{ color: "#c8a96e" }}>{active.points.length - 1}</b> segments.
          </span>
        ) : (
          <span style={{ color: "#5a5244" }}>Click any gap to trace a single strand. Hit "Edit Shape" to sculpt with cells.</span>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CelticKnotCustom />);
</script>
</body>
</html>
