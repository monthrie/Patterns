<!DOCTYPE html>
<html><head><style>
body { background: #1a1a1a; font-family: sans-serif; padding: 20px; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 800px; }
.sw { aspect-ratio: 1.4; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border: 1px solid #333; }
.sw span { background: rgba(0,0,0,0.6); color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 13px; align-self: flex-start; }
</style></head><body>
<h2>Proposed palette from yarn photo</h2>
<div class="grid">
<div class="sw" style="background:#f4f1e8"><span>Branco</span></div>
<div class="sw" style="background:#ecdcb0"><span>Creme</span></div>
<div class="sw" style="background:#e8c838"><span>Amarelo</span></div>
<div class="sw" style="background:#e8a020"><span>Ambar</span></div>
<div class="sw" style="background:#e84030"><span>Coral</span></div>
<div class="sw" style="background:#d4242c"><span>Vermelho</span></div>
<div class="sw" style="background:#e68a96"><span>Rosa Claro</span></div>
<div class="sw" style="background:#e4287c"><span>Rosa Choque</span></div>
<div class="sw" style="background:#c41878"><span>Magenta</span></div>
<div class="sw" style="background:#6a2aa0"><span>Roxo</span></div>
<div class="sw" style="background:#8ab840"><span>Verde Neon</span></div>
<div class="sw" style="background:#2e9a5e"><span>Verde Mar</span></div>
<div class="sw" style="background:#2aa0b4"><span>Turquesa</span></div>
<div class="sw" style="background:#1a1c28"><span>Preto</span></div>
</div>
</body></html>
